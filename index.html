 entity may refuse to transport a passenger who disrupts public order, threatens flight safety, or affects another person's life, health or property?","o":["Civil Aviation Authority of Vietnam.","Airports Authority.","The carrier.","Aviation security control force."],"a":2},{"id":251,"q":"Under which of the following circumstances shall an airport suspend operations?","o":["A disaster, incident, aviation accident, or another abnormal situation that threatens aviation safety or aviation security.","Upgrading, renovating, expanding, or repairing aviation infrastructure.","Failure to satisfy operating conditions.","Options A, B and C are correct."],"a":3},{"id":252,"q":"Under the Law on Civil Aviation of Vietnam, which of the following are included in flight operations management?","o":["Organization of the operation and use of airspace.","Issuance of flight permits; provision of air navigation services.","Coordination in flight operations management.","Options A, B and C are correct."],"a":3},{"id":253,"q":"Under the Law on Civil Aviation of Vietnam, in which of the following cases may a carrier refuse to carry cargo?","o":["The goods transported do not match the agreed type of goods.","The consignor does not comply with the carrier's conditions and instructions regarding packaging, packing, markings, and codes of goods.","Goods are refused transportation for national defense and security reasons.","Options B and C are correct."],"a":0},{"id":254,"q":"When is an aviation security search of passengers, flight-service personnel, baggage, cargo or aircraft conducted?","o":["Conducted periodically on 10% of randomly selected passengers on each flight","Conducted when there are signs of or information concerning a threat to flight security or safety.","Conducted on all passengers when the X-ray screening system experiences a technical failure.","Conducted at the direct request of the operating airline's representative."],"a":1},{"id":255,"q":"Under regulations, to which Ministry does the Vietnam Aviation Security Authority belong, and what authority does it have in relation to foreign airlines that fail to meet ICAO security standards?","o":["It belongs to the Ministry of Construction and may impose an administrative fine on the airline representative.","It belongs to the Ministry of Transport and may revoke the right to transmit flight data.","It belongs to the Ministry of Public Security and may consider and decide to temporarily suspend flight operations or suspend the airline.","It belongs to the Ministry of National Defense and may revoke air traffic rights for international flights."],"a":2},{"id":256,"q":"Under the Law on Prevention and Combat of Terrorism, what initial measure must be applied to money and property connected with terrorism or terrorist financing?","o":["Immediately confiscate all such assets for payment into the State budget upon receipt of suspicious information.","Suspend circulation, freeze, seal or temporarily seize them and handle them in accordance with law.","Immediately transfer them to the provincial Steering Committee for Counter-Terrorism for independent auction.","Immediately return them to the owner if the owner did not personally carry out the attack."],"a":1},{"id":257,"q":"Which agency is accountable to the Government for taking the lead and coordinating with the Ministry of National Defense and relevant ministries and sectors in state management of counter-terrorism?","o":["Ministry of Transport.","Ministry of Foreign Affairs.","Ministry of Public Security.","Ministry of National Defense."],"a":2},{"id":258,"q":"The National Air Navigation Services Program is promulgated to organize and operate a unified air navigation services system consistent with the air navigation services program of which organization?","o":["IATA.","VATM.","ICAO.","ACV."],"a":2},{"id":259,"q":"Which authority is competent to order the arrest of an aircraft?","o":["The regional People's Court having jurisdiction over the airport at which the aircraft requested to be arrested lands.","The Vietnam Civil Aviation Authority.","Airports Authority.","The Minister of Construction."],"a":0},{"id":260,"q":"How many progressively higher levels of enhanced aviation security control are prescribed in Article 23 of Decree No.215/2026/ND-CP?","o":["2 levels.","3 levels.","4 levels.","5 levels."],"a":1},{"id":261,"q":"Under Decree No.215/2026/ND-CP, which of the following persons is subject to a fixed-term air transport ban of between 03 and 12 months?","o":["A person who commits seizure or causes a riot at an air traffic services facility.","A person who commits seizure or causes a riot at an airport.","A person who, after being dealt with, continues to commit an act subject to a fixed-term transport ban of between 03 and 12 months.","A disruptive passenger."],"a":3},{"id":262,"q":"Under Decree No.215/2026/ND-CP, which of the following persons is considered a potential aviation security threat?","o":["A person refused entry or a deportee who does not voluntarily return to his or her country.","An accused person, defendant, prisoner, extradited person or person arrested under a wanted notice.","Persons who have lost the ability to perceive or control their behavior.","Options A, B and C are all correct."],"a":3},{"id":263,"q":"Under Clause 1, Article 13 of Decree No.215/2026/ND-CP, who is competent to decide on an aviation security search of an aircraft where a person on board makes a statement threatening flight security?","o":["Commander of the duty team working at the assigned target.","Head of the aviation security control unit at the airport.","Director General of the Immigration Department.","Pilot-in-command."],"a":1},{"id":264,"q":"At a specialized aerodrome without an aviation security control force, who is responsible for inspecting, supervising and ensuring aircraft security and preventing unauthorized persons or items from being brought on board?","o":["The provincial-level police authority where the specialized aerodrome is located.","Aircraft operator.","The provincial-level People's Committee.","An air navigation services provider."],"a":1},{"id":265,"q":"Where aviation security must be strengthened or an incident scene protected, which force shall take the lead and coordinate with the airport operator to establish a temporary restricted area?","o":["Aviation security control force at the airport.","An air navigation services provider.","Airports Authority.","The provincial-level Security Emergency Command Committee."],"a":0},{"id":266,"q":"The objectives, requirements and guiding approach for responding to acts of unlawful interference are based on how many on-site principles?","o":["2.","3.","4.","5."],"a":2},{"id":267,"q":"What is the validity period of a short-term airport security control card or permit?","o":["Not more than 07 days.","Not more than 15 days.","Not more than 30 days.","Not more than 60 days."],"a":2},{"id":268,"q":"If an aviation security control employee does not perform the rated duties, after how long will the issued rating cease to be valid?","o":["More than 03 consecutive months.","More than 06 consecutive months.","More than 09 consecutive months.","More than 12 consecutive months."],"a":1},{"id":269,"q":"Which authority is competent to issue a long-term airport security control card valid at one airport or at two or more airports?","o":["Civil Aviation Authority of Vietnam.","Immigration Department.","The provincial-level police authority where the airport is located.","International airport border-gate police authority."],"a":1},{"id":270,"q":"Under regulations on the responsibilities of People's Committees at all levels in localities with airports and aerodromes, which of the following duties relates to aviation security assurance and response to acts of unlawful interference?","o":["Independently approve the aviation security program of an airport within their administrative area.","Directly screen passengers and baggage in the terminal.","Determine boundaries and markers and install signs for important national-security-related facilities; ensure aviation security and safety in surrounding areas; and coordinate airport emergency response and responses to acts of unlawful interference with civil aviation.","Issue permits for aviation security forces to use weapons and supporting instruments."],"a":2},{"id":271,"q":"In an application dossier for an Airport Certificate submitted to the Civil Aviation Authority of Vietnam, which document directly related to aviation security must the managing and operating organization submit?","o":["A copy or electronic copy of the aviation security plan of an airline operating at the airport.","A copy or electronic copy of the aviation security coordination regulations between the police force and the Airports Authority.","A copy or electronic copy of an aviation security program or approved security assurance plan as prescribed by aviation security law.","A copy or electronic copy of the airport operator's internal security control procedures."],"a":2},{"id":272,"q":"If an aircraft accident within the territory of Vietnam causes the death or serious injury of a foreign citizen, which of the following rights does a representative of the victim's State have upon entering Vietnam?","o":["Publish the investigation findings through international mass media at any time.","Visit the aircraft accident site; participate in victim identification; coordinate with the investigation authority in interviewing surviving passengers who are citizens of that State; and receive a copy of the final investigation report.","Independently remove the entire aircraft wreckage and equipment to that State for a separate examination.","Sign, on behalf of Vietnam's Investigation Committee, the final report submitted to ICAO."],"a":1},{"id":273,"q":"Under aviation security quality control regulations, which of the following powers and duties does the Vietnam Aviation Security Authority have in relation to foreign airports and airlines?","o":["Unilaterally alter the internal regulations of a foreign aviation authority without agreement.","Consider and decide to temporarily suspend flights or suspend airlines operating flights from foreign countries to Vietnam that fail to comply with or satisfy ICAO aviation security standards","Require all foreign airlines to remit their entire flight revenue to the Immigration Department.","Directly appoint dedicated security forces for airports outside the territory of Vietnam."],"a":1},{"id":274,"q":"Which principle takes precedence in assuring state aircraft and special-cabin flights?","o":["Ensure compliance with Ministry of Foreign Affairs arrival and departure protocol.","Ensure absolute security and safety","Ensure flexibility and cost savings for the State budget.","Ensure public disclosure and transparency of the protection plan for protected persons traveling on the state aircraft."],"a":1},{"id":275,"q":"Which entity is responsible for controlling and ensuring the security of cargo, baggage and property of a state aircraft delegation and for maintaining order on board?","o":["Ministry of Public Security.","The enterprise commissioned to operate Vietnam's state aircraft or special-cabin flight.","The Airports Authority at the airport of take-off or landing.","The airport operator."],"a":1},{"id":276,"q":"How long before the estimated take-off or landing time of a state aircraft flight must inspection and confirmation that the runway, taxiway and apron are safe be completed?","o":["05 minutes.","10 minutes.","15 minutes.","30 minutes."],"a":1},{"id":277,"q":"How many minutes before the estimated landing time of a state aircraft must the designated runway be reserved exclusively for that aircraft?","o":["05 minutes.","10 minutes.","15 minutes.","30 minutes."],"a":0},{"id":278,"q":"How many minutes before the estimated landing time of a state aircraft must its designated parking stand be reserved exclusively in accordance with the plan?","o":["10 minutes.","15 minutes.","20 minutes.","30 minutes."],"a":3},{"id":279,"q":"When a state aircraft is taxiing on a taxiway or apron taxilane, what safe distance ahead of and behind it must be maintained by persons, vehicles and other aircraft not serving that flight?","o":["100 m.","200 m.","300 m.","500 m."],"a":3},{"id":280,"q":"In which of the following cases may a person independently performing official duties discharge a firearm at a person WITHOUT WARNING in order to maintain security and order?","o":["The person is using a weapon, explosive, force or another instrument to disrupt public order and threaten another person's life.","The person is wanted or under arrest and is resisting and threatening the life of the law-enforcement officer.","The person is using a weapon or explosive to directly commit an act of terrorism, engage in rioting, commit murder or take hostages.","Where it is clearly known that the person is committing a serious or very serious offense."],"a":2},{"id":281,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, trong phạm vi quản lý của đơn vị, Nhân viên kiểm soát an ninh hàng không có trách nhiệm nào sau đây?","o":["Quản lý nhân sự và chi trả lương ca trực.","Tuần tra, kiểm tra, giám sát an ninh.","Bảo dưỡng và sửa chữa các thiết bị an ninh.","Cấp phép cho các hoạt động đặc thù: hàn cắt, thi công trong không gian kín, làm việc trên cao."],"a":1},{"id":282,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, việc tổ chức ca trực của nhân viên kiểm soát an ninh hàng không phải đáp ứng như thế nào?","o":["Báo cáo lãnh đạo Công ty phê duyệt danh sách trực hàng ngày.","Tự do thay đổi lịch trực khi có lý do cá nhân.","Phân công ca trực đảm bảo yêu cầu kiểm tra, giám sát an ninh.","Bàn giao ca trực cho Thủ trưởng đơn vị khi hết ca."],"a":2},{"id":283,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, thẻ kiểm soát an ninh nội bộ của Công ty được cấp cho ai?","o":["Người được phép ra vào, hoạt động tại khu vực hạn chế của các đơn vị trực thuộc Công ty Cổ phần Nhiên liệu bay Petrolimex.","Người được phép ra vào, hoạt động tại khu vực hạn chế của nhà ga, sân bay phục vụ cho hoạt động tại cảng hàng không sân bay.","Người được phép ra vào, hoạt động tại khu vực nhà văn phòng Công ty Cổ phần Nhiên liệu bay Petrolimex.","Người được phép ra vào, hoạt động tại khu vực văn phòng cảng hàng không, sân bay."],"a":0},{"id":284,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, hành vi mượn thẻ kiểm soát an ninh của người khác dùng để ra, vào hoạt động trong khu vực hạn chế được thực hiện khi nào?","o":["Không được thực hiện trong mọi trường hợp.","Thực hiện trong trường hợp tham gia ứng phó với các tình huống khẩn nguy.","Thực hiện trong trường hợp tham gia ứng phó với các tình huống can thiệp bất hợp pháp.","Thực hiện khi có sự cho phép của Giám đốc Chi nhánh."],"a":0},{"id":285,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, người của các đơn vị thi công, sửa chữa sử dụng thẻ kiểm soát an ninh nội bộ có giá trị ngắn hạn khi hoạt động trong khu vực hạn chế phải đảm bảo điều kiện gì?","o":["Có nhân viên kiểm soát an ninh hoặc nhân viên của Công ty đi kèm","Phải đi từ 2 người trở lên để tự giám sát hoạt động của nhau","Chỉ được hoạt động tại khu vực văn phòng","Hoạt động trong khu vực hạn chế không quá 60 phút/lần vào"],"a":0},{"id":286,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, nhân viên kiểm soát an ninh hàng không thực hiện các biện pháp tăng cường an ninh theo chỉ đạo của ai?","o":["Lãnh đạo Chi nhánh và Công ty.","Giám đốc Cảng hàng không địa phương.","Trưởng Công an xã, phường.","Người trực số điện thoại hotline của đơn vị."],"a":0},{"id":287,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, khi xảy ra vụ việc vi phạm an ninh trong phạm vi quản lý, nhân viên kiểm soát an ninh hàng không có trách nhiệm xử lý như thế nào?","o":["Bàn giao ngay cho cấp trên và rời khỏi hiện trường.","Tổ chức xử lý ban đầu, bảo vệ hiện trường và bàn giao bằng chứng khi được yêu cầu.","Lập biên bản xử phạt hành chính đối với đối tượng vi phạm.","Chờ cơ quan chức năng đến mới tiến hành xử lý."],"a":1},{"id":288,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, các biển cảnh báo cấm lửa, cấm hút thuốc, cấm sử dụng điện thoại di động, cấm quay phim chụp ảnh phải được đặt ở đâu?","o":["Lối vào của các khu vực bồn bể, nhà xuất nhập.","Trong tủ để bình chữa cháy di động, tại các khu vực bồn bể, nhà xuất nhập.","Tại vị trí cao nhất của các khu vực bồn bể, nhà xuất nhập.","Vị trí có mái che của khu vực bồn bể, nhà xuất nhập."],"a":0},{"id":289,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, những ai được sử dụng hệ thống camera giám sát an ninh của Chi nhánh/Kho sân bay?","o":["Bất kể cán bộ, nhân viên nào của Công ty miễn là có nhu cầu sử dụng","Trực ban Chi nhánh, Chuyên viên an toàn","Nhân viên kiểm soát an ninh hàng không, Kỹ sư tự động hóa","Lãnh đạo Chi nhánh, trực ban, nhân viên kiểm soát an ninh hàng không"],"a":3},{"id":290,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, hệ thống camera giám sát tại khu vực hạn chế phải đảm bảo điều kiện gì?","o":["Chỉ hoạt động vào ban đêm.","Quan sát được tất cả các khu vực trọng yếu ban ngày, ban đêm.","Lưu dữ liệu tối thiểu 24 giờ.","Phân quyền sao cho chỉ có nhân viên kiểm soát an ninh hàng không được phép xem."],"a":1},{"id":291,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, phần trên cùng của hàng rào an ninh tại các kho nhiên liệu được xây dựng bằng vật liệu gì?","o":["Gạch thẻ.","Kẽm gai.","Gạch men.","Lưới B40."],"a":1},{"id":292,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, khi phát hiện niêm phong an ninh không đúng quy định như không chặt, dây niêm không đúng loại, niêm sai vị trí, sai mẫu mã quy định thì người phát hiện phải làm gì?","o":["Nhanh chóng báo cáo Lãnh đạo trực đơn vị xử lý đồng thời tiến hành lập Biên bản theo mẫu quy định.","Ghi vào sổ nhật ký để theo dõi.","Báo cáo lãnh đạo trực đơn vị.","Đáp án A, B và C đúng."],"a":0},{"id":293,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, loại thẻ nào sau đây được phép sử dụng để ra, vào, hoạt động trong khu vực hạn chế của Công ty?","o":["Thẻ nhà báo.","Thẻ kiểm soát an ninh nội bộ.","Thẻ đảng viên.","Thẻ căn cước."],"a":1},{"id":294,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, điều nào sau đây là đúng?","o":["Chỉ những cán bộ, nhân viên nội bộ của Công ty và Chi nhánh mới được phép ra, vào, hoạt động tại khu vực hạn chế của đơn vị.","Hành vi làm mất thẻ kiểm soát an ninh nội bộ sẽ bị phạt tiền.","Thẻ kiểm soát an ninh nội bộ phải đeo ở vị trí phía trước ngực bên ngoài áo.","Thẻ kiểm soát an ninh nội bộ bị hỏng, mờ các thông tin ghi trên thẻ nhưng vẫn còn thời hạn thì được tiếp tục sử dụng đến khi thẻ hết hạn."],"a":2},{"id":295,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, danh mục vật phẩm nguy hiểm bị cấm, hạn chế mang vào, sử dụng trong khu vực hạn chế của đơn vị không bao gồm vật dụng nào?","o":["Rìu chẻ củi.","Các vật dụng, đồ chơi giống vũ khí thật như súng, bom, mìn, lựu đạn, đạn, ngư lôi, thủy lôi…","Đèn pin phòng nổ.","Các loại dao có lưỡi dài trên 20 cm (không bao gồm cán dao)."],"a":2},{"id":296,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, nội dung nhân viên kiểm soát an ninh hàng không được phép kiểm tra đối với người ra, vào và hoạt động trong khu vực hạn chế không bao gồm nội dung nào?","o":["Thẻ kiểm soát an ninh hàng không.","Đồ vật mang theo người.","Hành lý, túi xách.","Dữ liệu ảnh và video trong điện thoại cá nhân."],"a":3},{"id":297,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, trong quá trình kiểm tra an ninh người, phương tiện khi vào khu vực hạn chế, nhân viên kiểm soát an ninh hàng không được quyền yêu cầu những người ngồi trên xe phải làm gì?","o":["Giữ nguyên vị trí đang ngồi trên xe để nhân viên kiểm soát an ninh hàng không lên kiểm tra.","Người lái xe mang theo giấy tờ xuống xuất trình, đăng kí với nhân viên kiểm soát an ninh hàng không; những người còn lại giữ nguyên vị trí.","Người điều khiển phương tiện và những người đi cùng rời khỏi phương tiện.","Chỉ cần lái xe cam kết những người trên xe không mang theo vật phẩm nguy hiểm."],"a":2},{"id":298,"q":"Đối tượng áp dụng của Chương trình An ninh hàng không của Công ty Cổ phần Nhiên liệu bay Petrolimex gồm những đối tượng nào?","o":["Tất cả các tổ chức, cá nhân trực thuộc hoặc nằm ngoài Công ty Cổ phần nhiên liệu bay Petrolimex.","Các tổ chức, cá nhân trực thuộc Công ty Cổ phần nhiên liệu bay Petrolimex; Tổ chức, cá nhân đến giao dịch, thăm quan và công tác tại các Chi nhánh trực thuộc Công ty Cổ phần Nhiên liệu bay Petrolimex.","Tổ chức, cá nhân đến giao dịch, thăm quan và công tác tại các Chi nhánh trực thuộc Công ty Cổ phần Nhiên liệu bay Petrolimex.","Các tổ chức, cá nhân trực thuộc Công ty Cổ phần nhiên liệu bay Petrolimex."],"a":1},{"id":299,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, hoạt động niêm phong an ninh phải đáp ứng điều kiện gì?","o":["Phải đảm bảo niêm phong an ninh sau khi tháo có thể tái sử dụng để tiết kiệm chi phí.","Phải đảm bảo sau khi niêm phong không thể bóc, dỡ hoặc nếu bóc, dỡ sẽ bị hỏng, không thể niêm phong lại.","Phải đảm bảo số niêm phải hướng ra phía ngoài để dễ dàng quan sát.","Phải đảm bảo thẩm mỹ của nút niêm."],"a":1},{"id":300,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, cán bộ và nhân viên của Công ty trước khi tuyển dụng phải đáp ứng điều kiện như thế nào?","o":["Lý lịch bản thân rõ ràng, không có tiền án, tiền sự, không nghiện ma túy và các chất kích thích.","Không nghiện thuốc lá.","Có kinh nghiệm làm việc ít nhất 02 năm trong ngành xăng dầu hoặc hàng không.","Hồ sơ dự tuyển phải có xác nhận tình trạng hôn nhân."],"a":0},{"id":301,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, các biển báo, biển cảnh báo phải được bố trí như thế nào?","o":["Phải được bố trí đảm bảo dễ quan sát, không bị che khuất.","Các biển báo, biển cảnh báo có nội dung giống nhau phải được bố trí cách nhau không quá 10 mét.","Phải được bố trí kèm với đèn để chiếu sáng cho biển báo, biển cảnh báo.","Phải bố trí một khu vực rộng rãi dùng riêng để tập trung đặt tất cả biển báo, biển cảnh báo."],"a":0},{"id":302,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, trách nhiệm của nhân viên kiểm soát an ninh hàng không đối với xe tra nạp nhiên liệu cho chuyến bay chuyên cơ là gì?","o":["Tham gia áp tải xe khi di chuyển trên đường giao thông công cộng.","Kiểm tra chất lượng nhiên liệu trước khi tra nạp.","","Trực giám sát hành trình GPS của xe tra nạp."],"a":0},{"id":303,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, quy định về ghi chép và lưu trữ hồ sơ liên quan đến nghiệp vụ kiểm soát an ninh thực hiện như thế nào?","o":["Lập, ghi chép và lưu trữ đầy đủ.","Lập, ghi chép đầy đủ và chỉ cần lưu trữ trong thời hạn 30 ngày.","Lập, ghi chép đầy đủ và hàng tuần phải chuyển toàn bộ về Công ty để lưu trữ.","Lập, ghi chép và lưu trữ khi có sự cố phát sinh."],"a":0},{"id":304,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, nội dung nào nằm trong quy trình kiểm tra an ninh đối với phương tiện xe xitec vận chuyển nhiên liệu trước khi vào khu vực hạn chế?","o":["Áp suất lốp của phương tiện.","Cabin của phương tiện.","Bảo hiểm của phương tiện.","Dữ liệu camera hành trình của phương tiện."],"a":1},{"id":305,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, hồ sơ cần có khi cấp thẻ kiểm soát an ninh nội bộ ngắn hạn gồm loại hồ sơ nào?","o":["Hợp đồng lao động.","Căn cước công dân hoặc thẻ căn cước.","Thẻ an toàn vệ sinh viên.","Bản khai cá nhân."],"a":1},{"id":306,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, trường hợp nào thì người và phương tiện vào hoạt động trong khu vực hạn chế không cần thẻ, giấy phép kiểm soát an ninh?","o":["Người, phương tiện có nhiệm vụ đột xuất.","Người, phương tiện có người của Công ty đi cùng.","Người, phương tiện qua kiểm tra không mang theo bất kỳ đồ vật, hàng hóa nào.","Người, phương tiện tham gia ứng phó các tình huống khẩn nguy, sự cố, đối phó với các hành vi can thiệp bất hợp pháp."],"a":3},{"id":307,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, nhân viên kiểm soát an ninh hàng không phải chấp hành sự kiểm tra, giám sát của cơ quan, đơn vị nào?","o":["Khách hàng và đối tác bất kỳ.","Cơ quan quản lý Nhà nước có thẩm quyền.","Các đơn vị cung cấp dịch vụ mặt đất tại cảng hàng không.","Chi bộ Đảng tại cơ sở."],"a":1},{"id":308,"q":"Theo Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex, khi có khách đề nghị được vào làm việc trong khu vực hạn chế, việc đầu tiên mà nhân viên kiểm soát an ninh hàng không phải thực hiện là gì?","o":["Nhanh chóng thực hiện thủ tục cấp thẻ kiểm soát an ninh nội bộ để khách đủ điều kiện vào làm việc.","Nhờ khách canh gác tại cổng để vào báo cáo cấp có thẩm quyền.","Đề nghị cung cấp thông tin: mục đích vào khu vực hạn chế, đầu mối liên hệ làm việc tại đơn vị là ai?","Hướng dẫn khách về các quy định an ninh an toàn nội bộ tại đơn vị."],"a":2},{"id":309,"q":"Mục đích chính của Chương trình ANHK của Công ty Cổ phần Nhiên liệu bay Petrolimex là gì?","o":["Được thiết lập để tăng doanh thu bán hàng.","Được thiết lập để tuân thủ và cụ thể hóa quy định của Nhà nước về an ninh hàng không: ngăn chặn, phòng ngừa và đối phó với các hành vi can thiệp bất hợp pháp.","Được thiết lập để hướng dẫn nhân viên kiểm soát an ninh có thể thực hiện tra nạp nhiên liệu cho tàu bay khi cần thiết.","Được thiết lập để bảo đảm chế độ tiền lương của nhân viên kiểm soát an ninh
