<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hệ Thống Ôn Tập Trắc Nghiệm 360 Câu</title><style>body{font-family:Arial,sans-serif;background:#f0f4f8;margin:0;padding:15px;color:#1e293b}.container{max-width:750px;margin:0 auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,0.05)}h1{text-align:center;color:#0f172a;font-size:22px;margin-bottom:20px}.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #e2e8f0}select,button{padding:10px 15px;font-size:15px;border-radius:8px;border:1px solid #cbd5e1;cursor:pointer}button.primary{background:#2563eb;color:#fff;border:none;font-weight:bold}.score-bar{position:sticky;top:0;background:#1e293b;color:#fff;padding:12px 15px;border-radius:8px;display:flex;justify-content:space-between;font-weight:bold;z-index:100;margin-bottom:20px}.q-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:15px;margin-bottom:15px}.q-title{font-weight:bold;font-size:16px;margin-bottom:12px;line-height:1.5}.opt-btn{display:block;width:100%;text-align:left;padding:12px;margin-bottom:8px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}.opt-btn.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#14532d;font-weight:bold}.opt-btn.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#7f1d1d}</style></head><body><div class="container"><h1>ÔN TẬP TRẮC NGHIỆM NỘI BỘ (360 CÂU)</h1><div class="controls"><select id="modeSelect"><option value="random40">Đề 40 câu ngẫu nhiên</option><option value="p1">Phần 1 (Câu 1 - 40)</option><option value="p2">Phần 2 (Câu 41 - 80)</option><option value="p3">Phần 3 (Câu 81 - 120)</option><option value="p4">Phần 4 (Câu 121 - 160)</option><option value="p5">Phần 5 (Câu 161 - 200)</option><option value="p6">Phần 6 (Câu 201 - 240)</option><option value="p7">Phần 7 (Câu 241 - 280)</option><option value="p8">Phần 8 (Câu 281 - 320)</option><option value="p9">Phần 9 (Câu 321 - 360)</option><option value="all">Làm toàn bộ 360 câu</option></select><button class="primary" onclick="startQuiz()">Bắt đầu / Làm đề mới</button></div><div class="score-bar"><span>Đã làm: <span id="doneCount">0</span>/<span id="totalCount">0</span></span><span>Đúng: <span id="correctCount">0</span> | Điểm: <span id="scoreVal">0</span></span></div><div id="quizArea"></div></div><script>const DB = [{"id":1,"q":"Phạm vi điều chỉnh của Luật Hàng không dân dụng Việt Nam bao gồm các quy định về những lĩnh vực nào sau đây?","o":["Tàu bay, cảng hàng không và nhân viên hàng không.","Tàu bay, cảng hàng không và hoạt động bay.","Vận tải hàng không thương mại, hàng không chuyên dùng, hàng không chung, an toàn hàng không, an ninh hàng không.","Tàu bay, cảng hàng không, nhân viên hàng không, hoạt động bay, vận tải hàng không thương mại, hàng không chuyên dùng, hàng không chung, an toàn hàng không, an ninh hàng không, trách nhiệm dân sự và các hoạt động khác có liên quan dến hàng không dân dụng."],"a":3},{"id":2,"q":"Theo Luật Hàng không dân dụng Việt Nam, tàu bay được xác định là đang bay trong khoảng thời gian nào?","o":["Kể từ thời điểm tàu bay nổ máy để cất cánh cho đến thời điểm tắt máy sau khi hạ cánh.","Kể từ thời điểm tàu bay đỗ tại sân đỗ tàu bay cho đến thời điểm tắt máy sau khi hạ cánh.","Kể từ thời điểm tàu bay nổ máy để cất cánh cho đến thời điểm hạ cánh.","Kể từ thời điểm hành khách đầu tiên lên tàu bay cho đến thời điểm hành khách cuối cùng xuống tàu bay."],"a":0},{"id":3,"q":"Under the 2025 Law on Civil Aviation of Vietnam, how is an international flight defined?","o":["A flight operated by a foreign airline.","A flight on which all passengers are foreign nationals.","A flight with at least one point of departure or arrival outside the territory of Vietnam.","A flight with at least one point of arrival outside the territory of Vietnam."],"a":2},{"id":4,"q":"Việc chia sẻ dữ liệu về hàng không dân dụng phải thực hiện như thế nào?","o":["Thực hiện thông qua hệ thống báo cáo nội bộ của các doanh nghiệp hoạt động trong lĩnh vực hàng không dân dụng.","Thực hiện thông qua nền tảng số, bảo đảm khả năng kết nối, đồng bộ và tuân thủ quy định của pháp luật về dữ liệu, bảo vệ dữ liệu cá nhân, an ninh mạng và quy định khác của pháp luật có liên quan.","Thực hiện thông qua nền tảng số, tuân thủ quy định của pháp luật về dữ liệu, bảo vệ dữ liệu cá nhân.","Thực hiện thông qua nền tảng số, tuân thủ quy định của pháp luật về an ninh, an toàn hàng không."],"a":1},{"id":5,"q":"Theo Luật Hàng không dân dụng Việt Nam, nguyên tắc hợp tác quốc tế về hàng không dân dụng bao gồm những nội dung nào?","o":["Bảo đảm độc lập, chủ quyền, toàn vẹn lãnh thổ và lợi ích quốc gia; đáp ứng yêu cầu về hội nhập quốc tế trên cơ sở bình đẳng, cùng có lợi.","Thực hiện trách nhiệm của quốc gia thành viên tại các tổ chức quốc tế mà Việt Nam là thành viên trong lĩnh vực hàng không dân dụng.","Thúc đẩy sự phát triển của ngành hàng không dân dụng Việt Nam theo tiêu chuẩn và thông lệ quốc tế.","Đáp án A, B và C đúng."],"a":3},{"id":6,"q":"Theo Luật Hàng không dân dụng Việt Nam, những hành vi nào sau đây bị nghiêm cấm trong hoạt động hàng không dân dụng?","o":["Đưa vật phẩm nguy hiểm vào tàu bay, cảng hàng không và khu vực hạn chế trái quy định.","Nuôi, thả động vật trong khu vực cảng hàng không.","Sử dụng thiết bị bay không người lái trái phép tại cảng hàng không và khu vực lân cận cảng hàng không.","Đáp án A, B và C đúng."],"a":3},{"id":7,"q":"\"Tàu bay chưa khởi hành\" bị đình chỉ thực hiện chuyến bay trong trường hợp nào sau đây?","o":["Tình huống cấp thiết phục vụ nhiệm vụ bảo vệ chủ quyền quốc gia, an ninh quốc gia; chuyến bay có dấu hiệu vi phạm các quy định về bảo đảm quốc phòng, an ninh quốc gia.","Vi phạm các quy định về tiêu chuẩn đủ điều kiện bay, khai thác tàu bay, an toàn hàng không, thủ tục chuyến bay, lập, thực hiện kế hoạch bay, thực hiện phép bay và dấu hiệu khác uy hiếp an toàn hàng không.","Có dấu hiệu bị uy hiếp an ninh hàng không, vi phạm các quy định về an ninh hàng không.","Đáp án A, B và C đúng."],"a":3},{"id":8,"q":"Theo Luật hàng không dân dụng Việt Nam, cảng hàng không được phân loại như thế nào?","o":["Cảng hàng không quốc tế, cảng hàng không nội địa và cảng hàng không chuyên dùng.","Cảng hàng không quốc tế và cảng hàng không chuyên dùng.","Cảng hàng không nội địa và cảng hàng không chuyên dùng.","Cảng hàng không quốc tế và cảng hàng không nội địa."],"a":0},{"id":9,"q":"Which of the following activities are included in commercial activities at an airport?","o":["Airport operation and commercial activities.","Provision of aviation services at the airport.","Provision of other services.","A, B and C are correct."],"a":3},{"id":10,"q":"Theo Luật Hàng không dân dụng Việt Nam, trường hợp nào sau đây cơ quan có thẩm quyền quyết định dừng khai thác cảng hàng không, công trình, một phần công trình tại cảng hàng không?","o":["Thảm họa, sự cố, tai nạn hàng không và các tình huống bất thường khác uy hiếp đến an toàn hàng không, an ninh hàng không.","Nâng cấp, cải tạo, mở rộng, sửa chữa kết cấu hạ tầng hàng không.","Không bảo đảm điều kiện khai thác.","Đáp án A, B và C đúng."],"a":3},{"id":11,"q":"Which entity is responsible for coordinating flight departure and arrival slots at an airport?","o":["Immigration Department.","Civil Aviation Authority of Vietnam.","Aircraft operator.","Airport operator."],"a":1},{"id":12,"q":"Việc cấp phép bay cho các chuyến bay hoạt động trong lãnh thổ của Việt Nam phải tuân thủ các nguyên tắc nào sau đây?","o":["Đáp ứng các yêu cầu về quốc phòng, an ninh, đối ngoại.","Bảo đảm an toàn hàng không, an ninh hàng không.","Phù hợp với năng lực của cảng hàng không, hệ thống cung cấp dịch vụ bảo đảm hoạt động bay.","Đáp án A, B và C đúng."],"a":3},{"id":13,"q":"Which of the following is not an air navigation service?","o":["Air traffic management.","In-flight catering services.","Aeronautical communication, navigation and surveillance services.","Aeronautical meteorological services."],"a":1},{"id":14,"q":"Theo Luật Hàng không dân dụng Việt Nam, khi nào tàu bay được xác định là bị lâm nguy?","o":["Tàu bay hoặc những người trong tàu bay bị nguy hiểm mà các thành viên tổ bay không thể khắc phục được.","Tàu bay bị mất liên lạc và chưa xác định được vị trí tàu bay.","Tàu bay hoặc những người trong tàu bay bị nguy hiểm mà các thành viên tổ bay không thể khắc phục được. Tàu bay bị mất liên lạc và chưa xác định được vị trí tàu bay.","Tàu bay bị hỏng nghiêm trọng khi lăn, cất cánh, đang bay, hạ cánh hoặc bị phá hủy hoàn toàn và tàu bay hạ cánh bắt buộc ngoài sân bay."],"a":2},{"id":15,"q":"Theo Luật Hàng không dân dụng Việt Nam, khái niệm \"vận tải hàng không thương mại\" được hiểu như thế nào?","o":["Vận tải hàng không thương mại là hoạt động khai thác tàu bay để vận chuyển hành khách nhằm mục đích kinh doanh.","Vận tải hàng không thương mại là hoạt động khai thác tàu bay để vận chuyển hành khách, hàng hóa hoặc bưu gửi nhằm mục đích kinh doanh.","Vận tải hàng không thương mại là vận chuyển hàng hóa, bưu gửi bằng đường hàng không. .","Vận tải hàng không thương mại là vận chuyển hành khách bằng đường hàng không."],"a":1},{"id":16,"q":"Hàng hóa bị từ chối vận chuyển trong trường hợp nào sau đây ?","o":["Hàng hóa được vận chuyển không đúng với loại hàng hóa đã thỏa thuận.","Người gửi hàng không tuân thủ điều kiện và hướng dẫn của người vận chuyển về bao bì, đóng gói, ký hiệu, mã hiệu hàng hóa.","Vì lý do quốc phòng, an ninh.","Đáp án A, B và C đúng."],"a":3},{"id":17,"q":"Theo Luật Hàng không dân dụng Việt Nam, hoạt động hàng không chung phải đáp ứng những điều kiện nào?","o":["Phải tuân thủ các quy định về tàu bay, khai thác tàu bay, hoạt động bay; Bảo đảm các điều kiện về an toàn hàng không, an ninh hàng không, bảo vệ môi trường và quy định khác của pháp luật có liên quan.","Bảo đảm các điều kiện về an toàn hàng không, an ninh hàng không, bảo vệ môi trường và quy định khác của pháp luật có liên quan.","Phải tuân thủ các quy định về tàu bay, khai thác tàu bay, hoạt động bay; Bảo đảm các điều kiện về an toàn hàng không, an ninh hàng không, bảo vệ môi trường.","Phải tuân thủ các quy định về tàu bay, khai thác tàu bay, hoạt động bay."],"a":0},{"id":18,"q":"Người vận chuyển có quyền từ chối vận chuyển hành khách trong các trường hợp nào sau đây?","o":["Do tình trạng sức khỏe của hành khách mà người vận chuyển nhận thấy việc vận chuyển hoặc vận chuyển tiếp sẽ gây nguy hại cho hành khách đó, cho những người khác trong tàu bay hoặc gây nguy hại cho chuyến bay.","Hành khách không chấp hành quy định về bảo đảm an toàn hàng không, an ninh hàng không, khai thác vận tải hàng không.","Theo yêu cầu của cơ quan nhà nước có thẩm quyền.","Đáp án A, B và C đúng."],"a":3},{"id":19,"q":"Theo Luật Hàng không dân dụng Việt Nam, nội dung nào sau đây là nghĩa vụ của hành khách?","o":["Thực hiện các quy định về bảo đảm an toàn hàng không, an ninh hàng không.","Thực hiện theo sự chỉ dẫn của người vận chuyển trong quá trình vận chuyển.","Bồi thường thiệt hại khi hành khách có lỗi gây ra thiệt hại cho người vận chuyển, người khai thác tàu bay.","Đáp án A, B và C đúng."],"a":3},{"id":20,"q":"Theo Luật Hàng không dân dụng Việt Nam, khái niệm “hàng hóa nguy hiểm” được định nghĩa như thế nào?","o":["Hàng hóa nguy hiểm là hàng hóa có chứa vật hoặc chất có khả năng gây nguy hiểm cho sức khỏe, tính mạng của con người, sự an toàn của chuyến bay, tài sản hoặc môi trường thuộc danh mục hàng hóa nguy hiểm trong lĩnh vực hàng không dân dụng.","Hàng hóa nguy hiểm là hàng hóa có chứa vật hoặc chất thuộc danh mục hàng hóa nguy hiểm trong lĩnh vực hàng không dân dụng.","Hàng hóa nguy hiểm là hàng hóa có chứa vật hoặc chất có khả năng gây nguy hiểm cho con người, tài sản hoặc môi trường.","Hàng hóa nguy hiểm là hàng hóa có tính chất nguy hiểm hoặc có khả năng gây ảnh hưởng đến an toàn chuyến bay, hành khách, tài sản và môi trường, thuộc danh mục hàng hóa bị hạn chế vận chuyển bằng đường hàng không."],"a":0},{"id":21,"q":"Theo Luật Hàng không dân dụng Việt Nam, khái niệm \"hợp đồng vận chuyển hàng hóa\" được định nghĩa như thế nào?","o":["Hợp đồng vận chuyển hàng hóa là sự thỏa thuận giữa người vận chuyển và người nhận hàng, theo đó người vận chuyển có nghĩa vụ vận chuyển và giao hàng hóa cho người nhận.","Hợp đồng vận chuyển hàng hóa là sự thỏa thuận giữa người vận chuyển và người thuê vận chuyển, theo đó người vận chuyển có nghĩa vụ vận chuyển hàng hóa đến địa điểm đến và trả hàng hóa cho người có quyền nhận; người thuê vận chuyển có nghĩa vụ thanh toán giá dịch vụ vận chuyển.","Là sự thỏa thuận giữa người vận chuyển và người thuê vận chuyển về việc vận chuyển hàng hóa, trong đó người vận chuyển chịu trách nhiệm giao hàng và người thuê vận chuyển thanh toán chi phí vận chuyển.","Hợp đồng vận chuyển hàng hóa là sự thỏa thuận theo đó người vận chuyển thực hiện việc vận chuyển hàng hóa đến địa điểm được chỉ định, còn người thuê vận chuyển có trách nhiệm giao hàng và thanh toán cước phí vận chuyển."],"a":1},{"id":22,"q":"Người gửi hàng có trách nhiệm gì trong việc cung cấp thông tin vận chuyển hàng hóa?","o":["Chịu trách nhiệm về tính chính xác của thông tin và cam kết liên quan đến hàng hóa được ghi trong vận đơn hàng không. Xuất trình các giấy tờ chỉ rõ tính chất của hàng hóa theo yêu cầu của cơ quan hải quan, công an và cơ quan khác có thẩm quyền.","Cung cấp thông tin, tài liệu cần thiết theo yêu cầu của cơ quan hải quan, công an và cơ quan khác có thẩm quyền trước khi hàng hóa được giao cho người nhận hàng. Người vận chuyển không có nghĩa vụ kiểm tra tính chính xác, đầy đủ của thông tin hoặc tài liệu mà người gửi hàng cung cấp.","Bồi thường thiệt hại gây ra cho người vận chuyển hoặc thiệt hại mà người vận chuyển phải chịu trách nhiệm do đã cung cấp thông tin không chính xác, không đầy đủ hoặc không đúng quy cách thông tin do người gửi hàng cung cấp vào các phương tiện lưu giữ thông tin.","Đáp án A, B và C đúng."],"a":3},{"id":23,"q":"Người vận chuyển phải mua bảo hiểm bắt buộc trách nhiệm bồi thường thiệt hại hoặc thực hiện các biện pháp bảo đảm khác đến mức giới hạn trách nhiệm bồi thường của người vận chuyển đối với các thiệt hại nào sau đây?","o":["Tính mạng, sức khỏe của hành khách.","Mất, thiếu hụt, hư hỏng hàng hóa, hành lý.","Các thiệt hại khác do vận chuyển chậm.","Đáp án A, B và C đúng."],"a":3},{"id":24,"q":"In which of the following circumstances are passengers, consignors, and consignees liable to compensate the carrier for damages?","o":["Causing damage to the carrier.","Causing damage to a third party for which the carrier is liable to provide compensation.","Causing damage to the carrier or to a third party for which the carrier is liable to provide compensation.","Passengers, consignors, and consignees are exempt from liability for compensating the carrier for damages in all circumstances."],"a":2},{"id":25,"q":"Trường hợp nào, người vận chuyển được miễn trách nhiệm bồi thường thiệt hại đối với hành lý ký gửi ?","o":["Thiệt hại xảy ra là do đặc tính tự nhiên hoặc khuyết tật vốn có của hàng hóa.","Hành lý ký gửi bị phá hủy, bị mất hoặc bị hư hỏng do sự kiện xảy ra trên tàu bay.","Hành lý ký gửi nằm trong sự quản lý của người vận chuyển.","Đáp án A, B và C đúng."],"a":0},{"id":26,"q":"Tổ chức nào có trách nhiệm trao đổi, chia sẻ thông tin an toàn hàng không và tạo điều kiện thuận lợi cho việc chia sẻ, trao đổi thông tin an toàn hàng không giữa các doanh nghiệp, tổ chức cung cấp dịch vụ hàng không nhằm mục đích nâng cao an toàn hàng không?","o":["Cục hàng không Việt Nam.","Nhà chức trách hàng không Việt Nam .","Tổ chức cung cấp dịch vụ bảo đảm hoạt động bay.","Đáp án A, B và C đúng."],"a":1},{"id":27,"q":"Theo Luật Hàng không dân dụng Việt Nam, quyền của người chỉ huy tàu bay bao gồm những quyền nào dưới đây?","o":["Quyết định và chịu trách nhiệm về việc cất cánh, hạ cánh.","Quyết định và chịu trách nhiệm về việc cất cánh, hạ cánh, hủy bỏ chuyến bay, quay trở lại nơi cất cánh hoặc hạ cánh khẩn cấp.","Quyết định và chịu trách nhiệm về việc quay trở lại nơi cất cánh hoặc hạ cánh khẩn cấp.","Quyết định và chịu trách nhiệm về việc cất cánh."],"a":1},{"id":28,"q":"Trong trường hợp tàu bay bị lâm nguy, lâm nạn, việc rời khỏi tàu bay của người chỉ huy tàu bay được quy định như thế nào?","o":["Phải là người đầu tiên rời khỏi tàu bay để báo cáo tình hình khẩn cấp.","Có quyền rời khỏi tàu bay bất cứ lúc nào cảm thấy nguy hiểm đến tính mạng tổ bay.","Phải là người cuối cùng rời khỏi tàu bay.","Không bắt buộc phải tuân theo thứ tự rời khỏi tàu bay nào."],"a":2},{"id":29,"q":"Biện pháp nào sau đây được áp dụng để bảo vệ tàu bay, công trình và trang thiết bị tại cảng hàng không?","o":["Tổ chức lực lượng vũ trang tuần tra khu vực cảng hàng không liên tục 24/7.","Thiết lập khu vực hạn chế tại cảng hàng không và nơi có công trình, trang thiết bị hàng không.","Di dời toàn bộ các công trình trang thiết bị hàng không ra khỏi khu vực đông dân cư.","Hạn chế hoàn toàn mọi phương tiện giao thông đường bộ tiếp cận các tỉnh thành có sân bay."],"a":1},{"id":30,"q":"Đối với hành khách gây rối hoặc người có hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng, pháp luật quy định biện pháp xử lý nào?","o":["Chỉ phạt tiền hành chính và cho phép tiếp tục đi máy bay bình thường sau đó.","Bắt buộc phải tham gia các khóa đào tạo ngắn hạn liên quan đến an ninh hàng không.","Cấm vận chuyển vĩnh viễn hoặc có thời hạn theo quy định.","Cải tạo không giam giữ và buộc khôi phục hiện trạng hư hỏng."],"a":2},{"id":31,"q":"Việc ra, vào và hoạt động trong khu vực hạn chế tại cảng hàng không phải tuân thủ quy định của cơ quan, tổ chức nào?","o":["Cục hàng không Việt Nam.","Bộ Xây dựng.","Cơ quan nhà nước có thẩm quyền.","Cảng vụ hàng không."],"a":2},{"id":32,"q":"What must an aircraft undergo before operating a flight?","o":["A comprehensive technical inspection of the aircraft engine.","Aviation security inspection and monitoring.","A detailed security search in all circumstances.","Screening of all passengers, flight crew, flight service personnel, other relevant persons, baggage, cargo, documents used for travel by air, mail, and other articles."],"a":1},{"id":33,"q":"Việc giám sát an ninh hàng không và duy trì trật tự trên tàu bay phải được thực hiện trong khoảng thời gian nào?","o":["Trước khi tàu bay cất cánh hoặc hạ cánh.","Chỉ thực hiện khi tàu bay ở độ cao ổn định.","Duy trì trong suốt chuyến bay.","Chỉ khi có sự cố gây mất trật tự xảy ra trên khoang tàu bay"],"a":2},{"id":34,"q":"Nhận định nào sau đây là đúng khi đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng?","o":["Trong trường hợp đặc biệt, vượt quá phạm vi thẩm quyền của các Bộ, ngành có liên quan, Thủ tướng Chính phủ quyết định xử lý các vấn đề về bảo đảm an toàn cho tàu bay, tổ bay, hành khách, hành lý, hàng hóa trong tàu bay.","Mọi biện pháp đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng phải ưu tiên đảm bảo an toàn cho tàu bay và tính mạng con người.","Tàu bay đang bay bị can thiệp bất hợp pháp phải được ưu tiên về điều hành bay và các trợ giúp cần thiết khác.","Đáp án A, B và C đúng."],"a":3},{"id":35,"q":"Hành vi cung cấp thông tin sai lệch ở mức độ nào bị coi là hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng?","o":["Cung cấp thông tin sai lệch về thời gian làm thủ tục hành lý ký gửi thông thường.","Cung cấp thông tin sai đến mức uy hiếp an toàn của tàu bay, hành khách, tổ bay, nhân viên mặt đất hoặc người tại cảng hàng không và công trình hàng không.","Cung cấp thông tin sai về thời gian cất cánh của chuyến bay.","Cung cấp thông tin sai về số lượng ghế trống thực tế trên chuyến bay."],"a":1},{"id":36,"q":"Lực lượng kiểm soát an ninh hàng không được tổ chức nhằm mục đích gì?","o":["Thực hiện các biện pháp bảo đảm an ninh hàng không, trật tự, an toàn xã hội theo chức năng, nhiệm vụ được giao.","Quản lý các hoạt động xuất nhập cảnh tại cảng hàng không.","Chỉ thực hiện nhiệm vụ bảo đảm an ninh khi xảy ra khủng bố hoặc can thiệp bất hợp pháp vào hoạt động HKDD.","Duy trì an ninh trật tự khu vực công cộng."],"a":0},{"id":37,"q":"Thẩm quyền bổ nhiệm Giám sát viên an ninh hàng không thuộc về tổ chức, cá nhân nào sau đây?","o":["Bộ trưởng Bộ Xây dựng.","Nhà chức trách an ninh hàng không Việt Nam.","Tổng giám đốc Tổng công ty cảng hàng không Việt Nam.","Nhà chức trách hàng không Việt Nam."],"a":1},{"id":38,"q":"Under the provisions of Law No. 130/2025/QH15, which of the following is NOT included in an aviation security program?","o":["Vietnam Civil Aviation Security Program.","Vietnam Civil Aviation Security Training Program.","National Aviation Counter-Terrorism Program.","Vietnam Aviation Security Quality Control Program."],"a":2},{"id":39,"q":"Cơ quan, tổ chức nào sau đây có trách nhiệm xây dựng chương trình an ninh hàng không trong phạm vi quản lý?","o":["người khai thác cảng hàng không và hãng hàng không.","Người khai thác cảng hàng không, người khai thác tàu bay, hãng hàng không, doanh nghiệp cung cấp dịch vụ không lưu và tổ chức liên quan khác.","Bộ Xây dựng và Cục Hàng không Việt Nam.","Lực lượng kiểm soát an ninh hàng không tại các cảng hàng không."],"a":1},{"id":40,"q":"Chương trình an ninh hàng không do các cơ quan, đơn vị xây dựng phải được trình cơ quan nào phê duyệt?","o":["Bộ Công an.","Nhà chức trách an ninh hàng không Việt Nam.","Bộ Xây dựng.","Ủy ban quốc gia về an ninh hàng không và tạo thuận lợi hàng không."],"a":1},{"id":41,"q":"Cơ quan nào là đầu mối giúp Chính phủ thực hiện thống nhất quản lý nhà nước về hàng không dân dụng?","o":["Bộ Xây dựng.","Bộ Công an.","Bộ Quốc phòng.","Ủy ban quốc gia về an ninh hàng không và tạo thuận lợi hàng không."],"a":0},{"id":42,"q":"Which authority has overall responsibility for state management of civil aviation?","o":["The Government.","The Ministry of Public Security.","The Ministry of Construction.","The National Assembly."],"a":0},{"id":43,"q":"Trách nhiệm của Ủy ban nhân dân các cấp, trong phạm vi nhiệm vụ, quyền hạn tại khu vực Cảng hàng không, sân bay?","o":["Thực hiện quản lý nhà nước khu vực lân cận cảng hàng không, bảo vệ môi trường cảng hàng không.","Phối hợp trong công tác tìm kiếm, cứu nạn và điều tra sự cố, tai nạn tàu bay, quản lý chướng ngại vật hàng không.","Quản lý đầu tư xây dựng cảng hàng không.","Đáp án A, B và C đúng."],"a":3},{"id":44,"q":"Under the applicable regulations, Vietnam’s Aviation Authority is an authority under which ministry?","o":["The Ministry of Public Security.","The Ministry of Construction.","The Ministry of National Defense.","The Government."],"a":1},{"id":45,"q":"Nhà chức trách hàng không Việt Nam có chức năng nào sau đây?","o":["Quản lý nhà nước về an toàn hàng không; nhiệm vụ, quyền hạn khác trong lĩnh vực hàng không dân dụng.","Trực tiếp kinh doanh vận tải hàng không thương mại và khai thác cảng hàng không.","Đầu tư xây dựng, kết cấu hạ tầng giao thông đường hàng không.","Cung cấp các dịch vụ bảo đảm hoạt động bay trên không phận Việt Nam."],"a":0},{"id":46,"q":"Which entity is responsible for organizing and carrying out the functions and duties of Vietnam’s Aviation Authority?","o":["The Minister of Construction.","The Prime Minister.","The head of Vietnam’s Aviation Authority.","The Minister of National Defense."],"a":0},{"id":47,"q":"Which organization is the Airports Authority under?","o":["The Ministry of Construction.","The provincial/municipal People's Committee where an airport is located.","Vietnam’s Aviation Authority.","Airports Corporation of Vietnam."],"a":2},{"id":48,"q":"Which of the following agencies is the Vietnamese aviation security authority under?","o":["Ministry of Public Security.","Ministry of Construction.","Ministry of National Defence.","Government."],"a":0},{"id":49,"q":"Nhiệm vụ trọng tâm trong việc xây dựng chương trình an ninh hàng không của Nhà chức trách an ninh hàng không Việt Nam là gì?","o":["Quản lý, khai thác và vận hành thương mại các hãng hàng không.","Phòng ngừa, phát hiện, ngăn chặn, đấu tranh làm thất bại các hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng.","Xây dựng và mở rộng cơ sở hạ tầng, đường băng, nhà ga tại các cảng hàng không.","Cung cấp các dịch vụ bảo đảm hoạt động bay và khí tượng hàng không."],"a":1},{"id":50,"q":"What mechanism does the Vietnamese aviation security authority use to coordinate activities among agencies and organizations?","o":["Ministry of Construction.","National Committee for Aviation Security and Facilitation.","Ministry of National Defence.","Ministry of Public Security."],"a":1},{"id":51,"q":"Which agency is responsible for leading and coordinating the activities of state management agencies at an airport?","o":["Vietnamese Aviation Security Authority.","Airport operator.","Civil Aviation Authority of Vietnam.","Airport Authority."],"a":3},{"id":52,"q":"Nghị định số 215/2026/NĐ-CP ngày 18/6/2026 của Chính phủ quy định về nội dung nào?","o":["Quy định về đào tạo, bồi dưỡng nghiệp vụ, huấn luyện an ninh hàng không.","Quy định chi tiết Chương trình an ninh hàng không và kiểm soát chất lượng an ninh hàng không Việt Nam.","Quy định về an ninh hàng không.","Quy định về xử phạt hành chính trong lĩnh vực hàng không dân dụng."],"a":2},{"id":53,"q":"Nghị định số 215/2026/NĐ-CP, ngày 18/6/2026 của Chính phủ về An ninh hàng không có hiệu lực thi hành từ ngày, tháng, năm nào?","o":["Ngày 30/6/2026.","Ngày 01/7/2026.","Ngày 03/7/2026.","Ngày 05/7/2026."],"a":1},{"id":54,"q":"Cấm vận chuyển bằng đường hàng không có thời hạn từ 03 tháng đến 12 tháng đối với các đối tượng có hành vi nào sau đây?","o":["Phát ngôn mang tính đe dọa sử dụng bom, mìn, chất nổ, vật liệu nổ, chất phóng xạ, vũ khí sinh học, hóa học trong khu vực làm thủ tục vận chuyển, khu vực cách ly, sân bay, trên tàu bay;.","Cố ý tung tin, cung cấp thông tin sai về việc có bom, mìn, vật liệu nổ, chất nổ, chất phóng xạ, vũ khí sinh học, hóa học gây ảnh hưởng đến hoạt động bình thường của hoạt động hàng không , cơ chế phối hợp liên ngành giữa các cơ quan quản lý nhà nước và doanh nghiệp nhằm mục đích gì?","o":["Thanh tra và xử lý vi phạm trong lĩnh vực hàng không dân dụng.","Kết nối, chia sẻ dữ liệu để quản trị thông minh, hỗ trợ, tạo thuận cho doanh nghiệp, hành khách, tăng sự cạnh tranh quốc gia.","Phân bổ nguồn vốn đầu tư công cho các doanh nghiệp hàng không.","Thống nhất quy định về giá vé và thuế đối với hành khách quốc tế."],"a":1},{"id":102,"q":"Under Decree No. 215/2026/ND-CP, the design of appropriate passenger routes and clear signage is also associated with providing support for which group?","o":["International flight crew.","Minor passengers.","Persons with disabilities.","Ground handling staff."],"a":2},{"id":103,"q":"Theo Nghị định 215/2026/NĐ-CP, cơ quan nào có trách nhiệm phối hợp, tham mưu, giúp Ủy ban quốc gia về an ninh hàng không và tạo thuận lợi hàng không ban hành các chủ trương, chính sách về tạo thuận lợi hàng không?","o":["Cục Hàng không Việt Nam và Bộ Giao thông vận tải.","Nhà chức trách an ninh hàng không Việt Nam, Nhà chức trách an toàn Việt Nam.","Tổng công ty Cảng hàng không Việt Nam và các hãng hàng không.","Ủy ban Quản lý vốn nhà nước tại doanh nghiệp."],"a":1},{"id":104,"q":"What does Decree No. 205/2026/ND-CP regulate?","o":["Aviation safety.","Aviation security.","Airports and Airfields.","Ensuring the quality of aviation services."],"a":2},{"id":105,"q":"Nghị định 205/2026/NĐ-CP về Cảng hàng không và bãi cất, hạ cánh, Công trình thiết yếu của cảng hàng không gồm những công trình nào dưới đây?","o":["Công trình trong sân bay.","Công trình an ninh hàng không, công trình cung cấp địch vụ bảo đảm hoạt động bay, công trình nhà ga hành khách.","Công trình hạ tầng kỹ thuật dùng chung.","Đáp án A, B và C đúng."],"a":3},{"id":106,"q":"Theo quy định của Luật số 42/2024/QH15 về Luật quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ, nhóm nào sau đây nằm trong danh mục các loại vũ khí?","o":["Vũ khí quân dụng, vũ khí thô sơ, vũ khí tự chế, công cụ hỗ trợ.","Vũ khí quân dụng, vũ khí thô sơ, vũ khí thể thao, súng săn.","Vũ khí thô sơ, vũ khí thể thao, súng săn, vật liệu nổ.","Vũ khí quân dụng, vũ khí thể thao, súng săn, công cụ hỗ trợ."],"a":1},{"id":107,"q":"Theo quy định của Luật số 42/2024/QH15 về Luật quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ, khái niệm 'công cụ hỗ trợ' bao gồm những loại nào dưới đây?","o":["Các loại vũ khí quân dụng và động vật nghiệp vụ.","Phương tiện và động vật nghiệp vụ.","Phương tiện, trang thiết bị kỹ thuật số và vũ khí thô sơ.","Trang phục chuyên ngành và các loại súng săn."],"a":1},{"id":108,"q":"Các phương tiện, thiết bị phục vụ chuyến bay chuyên cơ và chuyên khoang (bao gồm xe dự phòng) phải được tập kết tại khu vực phục vụ trước thời điểm phục vụ tối thiểu bao lâu?","o":["Tối thiểu 15 phút.","Tối thiểu 30 phút.","Tối thiểu 60 phút.","Tối thiểu 120 phút."],"a":1},{"id":109,"q":"Đối với mỗi hành vi vi phạm hành chính trong lĩnh vực hàng không dân dụng, cá nhân và tổ chức phải chịu hình thức xử phạt nào sau đây?","o":["Cảnh cáo.","Phạt tiền.","Cải tạo không giam giữ.","Đáp án A và B đúng."],"a":3},{"id":110,"q":"Theo Nghị định 17/2026/NĐ-CP sửa đổi, bổ sung một số điều trong Nghị định 162/2018/NĐ-CP, Cục trưởng Cục Hàng không Việt Nam có thẩm quyền xử phạt như thế nào với hành vi vi phạm hành chính trong lĩnh vực hàng không dân dụng?","o":["Cảnh cáo.","Phạt tiền.","Tước quyền sử dụng giấy phép có thời hạn hoặc đình chỉ hoạt động có thời hạn.","Đáp án A, B và C đúng."],"a":3},{"id":111,"q":"Tổ chức, cá nhân nào dưới dây là đối tượng bị xử phạt vi phạm hành chính trong lĩnh vực hàng không dân dụng?","o":["Cá nhân, tổ chức Việt Nam và cá nhân, tổ chức nước ngoài có hành vi vi phạm hành chính trong lĩnh vực hàng không dân dụng trong lãnh thổ Việt Nam, trên tàu bay đăng ký quốc tịch Việt Nam.","Cá nhân, tổ chức Việt Nam và cá nhân, tổ chức nước ngoài có hành vi vi phạm hành chính trong lãnh thổ Việt Nam, trên tàu bay đăng kí quốc tịch Việt Nam.","Cá nhân, tổ chức Việt Nam và cá nhân, tổ chức nước ngoài có hành vi vi phạm hành chính trong lãnh thổ Việt Nam.","Cá nhân, tổ chức hoạt động trên lãnh thổ Việt Nam."],"a":0},{"id":112,"q":"Theo Nghị định 17/2026/NĐ-CP, Giám đốc Cảng vụ hàng không có quyền áp dụng hình thức xử phạt bổ sung nào sau đây đối với vi phạm hành chính trong lĩnh vực hàng không?","o":["Cấm vận chuyển vĩnh viễn.","Phạt tiền đến 100.000.000 đồng.","Tước quyền sử dụng giấy phép có thời hạn hoặc đình chỉ hoạt động có thời hạn.","Không có đáp án nào đúng."],"a":2},{"id":113,"q":"Which Decree provides for administrative penalties for violations in the civil aviation sector?","o":["Decree No. 162/2018/ND-CP.","Decree No. 92/2015/ND-CP.","Decree No. 96/2021/ND-CP.","Decree No. 215/2026/ND-CP."],"a":0},{"id":114,"q":"Hành vi uống rượu, bia trong giờ làm việc hoặc có nồng độ cồn trong hơi thở, trong máu khi thực hiện nhiệm vụ sẽ bị xử phạt bằng hình thức nào sau đây?","o":["Tước quyền sử dụng giấy phép, chứng chỉ hành nghề.","Phạt tiền.","Sa thải.","Các biện pháp khắc phục hậu quả."],"a":1},{"id":115,"q":"Theo Nghị định 17/2026/NĐ-CP, Trưởng phòng Quản lý xuất nhập cảnh thuộc Công an cấp tỉnh có thẩm quyền xử phạt dưới hình thức nào?","o":["Phạt cảnh cáo.","Phạt tiền.","Tước quyền sử dụng giấy phép có thời hạn .","Đáp án A, B và C đúng."],"a":3},{"id":116,"q":"Hành vi không đeo thẻ kiểm soát an ninh hàng không theo quy định khi làm nhiệm vụ trong khu vực hạn chế của cảng hàng không, sân bay với vi phạm lần đầu sẽ chịu hình thức xử phạt nào?","o":["Phạt cảnh cáo.","Phạt tiền từ 500.000đ-1.000.000đ.","Phạt tiền từ 1.000.000đ-2.000.000đ.","Phạt tiền từ 2.000.000đ-3.000.000đ."],"a":0},{"id":117,"q":"Hành vi đe dọa, lăng mạ nhân viên hàng không, hành khách hoặc người khác tại cảng hàng không, sân bay và nơi có công trình, trang bị, thiết bị hàng không dân dụng sẽ phải chịu hình thức xử lý nào?","o":["Từ chối vận chuyển.","Cấm bay vĩnh viễn.","Phạt tiền.","Đáp án A và B đúng."],"a":2},{"id":118,"q":"Hành vi không thực hiện kiểm tra trực quan ngẫu nhiên sau kiểm tra an ninh đối với hành khách, hành lý xách tay, người ra vào làm việc tại khu vực hạn chế của cảng hàng không, sân bay theo quy định sẽ chịu hình thức xử lý nào?","o":["Khiển trách.","Tước quyền sử dụng giấy phép, chứng chỉ hành nghề.","Phạt tiền.","Đáp án A và B đúng."],"a":2},{"id":119,"q":"Chiến sĩ Công an nhân dân đang thi hành công vụ có thẩm quyền xử phạt như thế nào đối với các vi phạm trong lĩnh vực hàng không dân dụng?","o":["Phạt cảnh cáo.","Phạt tiền.","Tịch thu tang vật, phương tiện vi phạm hành chính.","Đáp án A, B và C đúng."],"a":3},{"id":120,"q":"Cá nhân nào sau đây có thẩm quyền xử phạt vi phạm hành chính trong lĩnh vực hàng không dân dụng?","o":["Thanh tra hàng không Việt Nam.","Giám đốc Cảng vụ hàng không.","Chủ tịch Uỷ ban nhân dân cấp tỉnh.","Đáp án A, B và C đúng."],"a":3},{"id":121,"q":"Theo Luật Hàng không dân dụng Việt Nam, An ninh hàng không là gì?","o":["Sử dụng kết hợp các biện pháp để phòng ngừa, ngăn chặn và đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng.","Sử dụng kết hợp nguồn nhân lực, trang bị, thiết bị để phòng ngừa, ngăn chặn và đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng.","An ninh hàng không là bộ phận của an ninh quốc gia, được tiến hành bằng việc kết hợp sử dụng các biện pháp, nhân lực và nguồn lực vật chất nhằm bảo vệ hoạt động hàng không dân dụng, phòng ngừa và chống lại các hành vi can thiệp bất hợp pháp.","Sử dụng kết hợp nguồn nhân lực, trang bị, thiết bị để đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng, bảo vệ an toàn cho tàu bay, hành khách, tổ bay và những người dưới mặt đất."],"a":2},{"id":122,"q":"Theo Luật Hàng không dân dụng Việt Nam, khu vực hạn chế là gì?","o":["Khu vực của Cảng hàng không, mà việc ra, vào hoạt động tại đó phải tuân thủ các quy định của cơ quan nhà nước có thẩm quyền.","Nơi có công trình, trang bị, thiết bị hàng không mà việc vào, ra và hoạt động tại đó phải tuân thủ các quy định của cơ quan nhà nước có thẩm quyền.","Khu vực của Cảng hàng không và nơi có công trình, trang bị, thiết bị hàng không mà việc ra, vào và hoạt động tại đó phải tuân thủ các quy định của cơ quan nhà nước có thẩm quyền. Khu vực hạn chế được kiểm tra, soi chiếu, giám sát, lục soát an ninh hàng không.","Nơi có công trình, trang bị, thiết bị hàng không mà việc vào, ra và hoạt động tại đó phải tuân thủ các quy định của cơ quan nhà nước có thẩm quyền và được kiểm tra, soi chiếu, giám sát, lục soát an ninh hàng không theo quy định."],"a":2},{"id":123,"q":"Theo Luật Hàng không dân dụng Việt Nam, việc thiết lập các khu vực hạn chế tại Cảng hàng không và nơi có công trình, trang bị, thiết bị hàng không phải bảo đảm những tiêu chí nào?","o":["Phải phù hợp với mục đích bảo đảm an ninh hàng không.","Phải phù hợp với tính chất hoạt động hàng không dân dụng.","Phải phù hợp với nhu cầu sử dụng của hành khách đi tàu bay.","Đáp án A, B và C đúng."],"a":3},{"id":124,"q":"Theo Luật Hàng không dân dụng Việt Nam, việc kiểm tra đối với hành khách, thành viên tổ bay, người phục vụ chuyến bay, người có liên quan, hành lý, hàng hóa, bưu gửi và các vật phẩm khác được thực hiện như thế nào?","o":["Phải được kiểm tra, soi chiếu, giám sát an ninh hàng không trước khi lên tàu bay.","Trường hợp có dấu hiệu hoặc có thông tin đe dọa liên quan đến an ninh, an toàn của chuyến bay thì phải được lục soát an ninh hàng không.","Thành viên tổ bay, người phục vụ chuyến bay được miễn kiểm tra, soi chiếu an ninh hàng không.","Đáp án A và B đúng."],"a":3},{"id":125,"q":"Theo Luật Hàng không dân dụng Việt Nam, vật phẩm nguy hiểm bao gồm những loại nào sau đây?","o":["Vũ khí, đạn dược, chất cháy, chất dễ cháy, chất nổ, chất dễ nổ, chất độc hóa học và sinh học","Vũ khí, đạn dược, chất cháy, chất dễ cháy, chất nổ, chất dễ nổ, chất độc hóa học và sinh học, chất phóng xạ và các vật hoặc chất khác có khả năng gây nguy hiểm hoặc được dùng để gây nguy hiểm cho sức khỏe, tính mạng của con người, an toàn của chuyến bay.","Các vật hoặc chất có khả năng gây nguy hiểm cho sức khỏe, tính mạng của con người, an toàn của chuyến bay.","Chất cháy, chất dễ cháy, chất nổ, chất dễ nổ, chất độc hóa học và sinh học, chất phóng xạ."],"a":1},{"id":126,"q":"Theo Nghị định 215/2026/NĐ-CP, lực lượng kiểm soát an ninh hàng không đang làm nhiệm vụ trong phạm vi thuộc thẩm quyền được phép áp dụng các biện pháp nào sau đây?","o":["Khi thực hiện nhiệm vụ trong phạm vi thẩm quyền được áp dụng biện pháp bảo đảm an ninh nhằm phòng ngừa, ngăn chặn đối với người có hành vi uy hiếp an ninh, an toàn hàng không, cản trở hoặc cố tình chống đối; thu giữ vũ khí, chất nổ, chất cháy và những vật phẩm nguy hiểm khác đưa trái phép vào khu vực hạn chế.","Xử lý các hành vi vi phạm an ninh hàng không, trường hợp quá thẩm quyền thì chuyển giao cho cơ quan nhà nước có thẩm quyền để xử lý theo quy định pháp luật.","Yêu cầu hãng hàng không từ chối vận chuyển hành khách vì lý do an ninh theo quy định.","Đáp án A, B và C đúng."],"a":3},{"id":127,"q":"Theo Nghị định 215/2026/NĐ-CP ngày 18/06/2026, kết cấu hạ tầng đảm bảo an ninh hàng không phải  đáp ứng các yêu cầu nào sau đây?","o":["Hệ thống hàng rào, hệ thống cảnh báo xâm nhập, bốt gác, cổng, cửa, đường tuần tra, hệ thống chiếu sáng an ninh, hệ thống camera giám sát an ninh, biển cảnh báo, vị trí tập kết khẩn ngụy","Vị trí đỗ biệt lập, hầm hoặc khu vực xử lý bom, mìn, vật phẩm nguy hiểm đáp ứng yêu cầu về bảo đảm an ninh hàng không và phù hợp với kết quả đánh giá rủi ro an ninh hàng không.","Đáp ứng các yêu cầu phục vụ việc kiểm tra, soi chiếu, lục soát, giám sát an ninh hàng không đối với người, phương tiện, đồ vật, hành lý, hàng hóa, bưu gửi và phục vụ truy xét.","Đáp án A, B và C đúng."],"a":3},{"id":128,"q":"Theo Thông tư 14/2026/TT-BCA, ký kiệu khu vực hạn chế số 6 trên thẻ kiểm soát an ninh cảng hàng không, sân bay là gì?","o":["Khu vực sân đỗ tàu bay, đường hạ cất cánh, đường lăn và các khu vực khác trong sân bay","Khu vực hạn chế ga đến nội địa, quốc tế (Khu vực băng chuyền hành lý và các khu vực hạn chế khác tại ga đến quốc nội, quốc tế)","Khu vực nhà khách chuyên cơ trong những thời gian không có chuyến bay chuyên cơ;","Khu vực xử lý, phân loại hàng hóa, bưu gửi trong nhà ga hàng hóa"],"a":1},{"id":129,"q":"Theo Nghị định 215/2026/NĐ-CP, nội dung nào sau đây thuộc nhiệm vụ, quyền hạn của lực lượng kiểm soát an ninh hàng không?","o":["Thực hiện các nhiệm vụ kiểm soát an ninh hàng không theo thẩm quyền; quản lý nhà nước về an ninh hàng không.","Xây dựng và triển khai phương án đối phó ban đầu với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng tại cảng hàng không, cơ sở xử lý hàng hóa, bưu gửi; tấn công, chế áp tàu bay không người lái xâm phạm khu vực được giao quản lý.","Đình chỉ thực hiện chuyến bay nhằm ngăn chặn khả năng gây uy hiếp an ninh, an toàn đối với chuyến bay.","Đáp án A và B đúng."],"a":3},{"id":130,"q":"Theo Nghị định 215/2026/NĐ-CP, việc phối hợp kiểm tra, giám sát, kiểm soát hành lý, hàng hóa, bưu gửi để phát hiện, ngăn chặn vật phẩm nguy hiểm đưa trái phép lên tàu bay xuất cảnh thuộc trách nhiệm lực lượng nào dưới đây?","o":["Hải quan.","Kiểm soát An ninh hàng không.","Cảng vụ hàng không.","Đáp án A và B đúng."],"a":3},{"id":131,"q":"Theo Nghị định 215/2026/NĐ-CP, lực lượng kiểm soát an ninh hàng không có nhiệm vụ, quyền hạn nào sau đây?","o":["Phối hợp với các cơ quan, đơn vị chức năng để rà, phá, xử lý bom, mìn, vũ khí sinh học, hóa học, chất phóng xạ; ngăn chặn dịch bệnh tại cảng hàng không, trên tàu bay.","Khi thực hiện nhiệm vụ trong phạm vi thẩm quyền được áp dụng biện pháp bảo đảm an ninh nhằm phòng ngừa, ngăn chặn đối với người có hành vi uy hiếp an ninh, an toàn hàng không, cản trở hoặc cố tình chống đối; thu giữ vũ khí, chất nổ, chất cháy và những vật phẩm nguy hiểm khác đưa trái phép vào khu vực hạn chế.","Đề nghị Cục trưởng Cục hàng không đình chỉ thực hiện chuyến bay nhằm ngăn chặn khả năng uy hiếp an ninh đối với chuyến bay.","Đáp án A, B và C đúng"],"a":0},{"id":132,"q":"Theo Nghị định 215/2026/NĐ-CP, vì lý do an ninh,  hãng hàng không có quyền từ chối vận chuyển những hành khách nào sau đây?","o":["Người mất khả năng nhận thức hoặc điều khiển hành vi của mình.","Trường hợp hành khách bị từ chối nhập cảnh nhưng không tự nguyện về nước không do hãng hàng không vận chuyển vào Việt Nam.","Theo yêu cầu của cơ quan có thẩm quyền của Việt Nam hoặc nước ngoài.","Đáp án A, B và C đúng."],"a":3},{"id":133,"q":"Theo Nghị định 215/2026/NĐ-CP, Hành lý, đồ vật không xác định được chủ sở hữu hoặc người quản lý, sử dụng được phát hiện tại cảng hàng không và các khu vực hạn chế khác thì lực lượng kiểm soát an ninh hàng không phải thực hiện biện pháp gì?","o":["Thông báo cho Hãng hàng không và lục soát hành lý, đồ vật đó.","Lục soát an ninh hàng không đối với hành lý, đồ vật đó.","Thông báo cho Cảng vụ hàng không và lục soát hành lý, đồ vật đó.","Thông báo cho Công an địa phương."],"a":1},{"id":134,"q":"Theo Nghị định 215/2026/NĐ-CP, trước khi tiến hành lục soát an ninh hàng không đối với tàu bay, lực lượng kiểm soát an ninh hàng không phải thông báo cho cơ quan, đơn vị nào?","o":["Thông báo người khai thác tàu bay.","Thông báo Cảng vụ hàng không liên quan và Cục Hàng không Việt Nam.","Thông báo cho cảng vụ hàng không liên quan, người khai thác cảng hàng không và người khai thác tàu bay.","Thông báo người khai thác tàu bay và Cục Hàng không Việt Nam."],"a":2},{"id":135,"q":"Theo Nghị định 215/2026/NĐ-CP, hành lý thất lạc, nhầm lẫn trước khi đưa vào khu vực lưu giữ và trước khi được đưa lại lên tàu bay phải được thực hiện biện pháp kiểm tra an ninh hàng không như thế nào?","o":["Kiểm tra trực quan.","Kiểm tra, soi chiếu an ninh hàng không.","Thông báo cho Hãng hàng không.","Thông báo cho Cảng vụ hàng không."],"a":1},{"id":136,"q":"Theo Nghị định 215/2026/NĐ-CP, suất ăn, đồ vật dự phòng, đồ vật phục vụ trên chuyến bay, nhiên liệu cho tàu bay và các đồ vật khác khi vào khu vực hạn chế, đưa lên tàu bay phải chịu sự kiểm tra an ninh hàng không như thế nào?","o":["Phải chịu sự kiểm tra an ninh hàng không thích hợp khi vào khu vực hạn chế, đưa lên tàu bay.","Phải chịu sự kiểm tra an ninh hàng không khi vào khu vực hạn chế, đưa lên tàu bay; chịu sự kiểm tra, giám sát an ninh hàng không liên tục của lực lượng kiểm soát an ninh hàng không tại cảng hàng không.","Phải chịu sự giám sát an ninh hàng không liên tục của lực lượng kiểm soát an ninh hàng không tại cảng hàng không, sân bay.","Phải chịu sự kiểm tra an ninh hàng không thích hợp khi vào khu vực hạn chế, đưa lên tàu bay; chịu sự giám sát an ninh hàng không liên tục của người khai thác tàu bay."],"a":1},{"id":137,"q":"Theo Nghị định 215/2026/NĐ-CP, biện pháp đảm bảo an ninh hàng không tăng cường cấp độ 1 được áp dụng trong trường hợp nào sau đây?","o":["Có thông tin tình báo về một âm mưu can thiệp bất hợp pháp vào hoạt động hàng không dân dụng nhưng chưa xác định địa điểm, mục tiêu, thời gian cụ thể; có tình hình mất an ninh chính trị, trật tự xã hội nghiêm trọng tại địa phương.","Có sự kiện chính trị, xã hội trọng đại của đất nước, có tình hình an ninh chính trị, trật tự xã hội phức tạp.","Có thông tin xác thực về một âm mưu can thiệp bất hợp pháp vào hoạt động hàng không dân dụng có địa điểm, mục tiêu, thời gian cụ thể; Có tình hình mất an ninh chính trị, trật tự xã hội đặc biệt nghiêm trọng tại địa phương.","Có thông báo của hãng hàng không."],"a":1},{"id":138,"q":"Theo Nghị định 215/2026/NĐ-CP, biện pháp đảm bảo an ninh hàng không tăng cường cấp độ 2 được áp dụng trong trường hợp nào sau đây?","o":["Có sự kiện chính trị, xã hội trọng đại của đất nước,có tình hình an ninh chính trị, trật tự xã hội phức tạp.","Có thông tin tình báo về một âm mưu can thiệp bất hợp pháp vào hoạt động hàng không dân dụng nhưng chưa xác định địa điểm, mục tiêu, thời gian cụ thể; có tình hình mất an ninh chính trị, trật tự xã hội nghiêm trọng tại địa phương.","Có thông tin xác thực về một âm mưu can thiệp bất hợp pháp vào hoạt động hàng không dân dụng có địa điểm, mục tiêu, thời gian cụ thể; Có tình hình mất an ninh chính trị, trật tự xã hội đặc biệt nghiêm trọng tại địa phương.","Có thông báo của hãng hàng không."],"a":1},{"id":139,"q":"Theo Nghị định 215/2026/NĐ-CP, hành khách gây rối được hiểu như thế nào?","o":["Không chấp hành các quy định về ứng xử tại Cảng hàng không hoặc trên tàu bay.","Không tuân thủ hướng dẫn của lực lượng kiểm soát an ninh hàng không hoặc nhân viên hàng không hoặc tổ bay từ đó ảnh hưởng tới an ninh trật tự và kỷ luật tại cảng hàng không hoặc trên tàu bay.","Hành khách nói chuyện to gây ồn ào tại khu vực công cộng, khu vực hạn chế.","Đáp án A và B đúng."],"a":3},{"id":140,"q":"Theo Nghị định 215/2026/NĐ-CP, trong trường hợp có người trên tàu bay phát ngôn đe dọa an toàn của chuyến bay, cần thực hiện biện pháp nào sau đây?","o":["Lục soát an ninh hàng không.","Kiểm tra trực quan bằng dụng cụ, thiết bị phát hiện chất nổ hoặc các biện pháp  thích hợp khác.","Giám sát bằng camera giám sát an ninh hoặc nhân viên kiểm soát an ninh hàng không trực tiếp giám sát.","Đáp án A, B và C đúng."],"a":0},{"id":141,"q":"Theo Nghị định 215/2026/NĐ-CP, khi hành khách rời khỏi tàu bay tại bất cứ điểm dừng nào của chuyến bay, đơn vị nào phải kiểm tra lại để bảo đảm hành khách đã xuống khỏi tàu bay và không để lại hành lý hoặc bất cứ vật gì trên tàu bay?","o":["Lực lượng kiểm soát an ninh hàng không.","Người khai thác tàu bay.","Hãng hàng không.","Doanh nghiệp cung cấp dịch vụ không lưu."],"a":1},{"id":142,"q":"Theo Nghị định 215/2026/NĐ-CP, ngay khi nhận được thông tin đe dọa liên quan đến an ninh, an toàn của tàu bay, chuyến bay, người khai thác tàu bay phải thông báo kịp thời cho cơ quan, tổ chức nào tại cảng hàng không liên quan và thực hiện các biện pháp cần thiết để bảo đảm an toàn cho chuyến bay?","o":["Hãng hàng không.","Doanh nghiệp cung cấp dịch vụ không lưu.","Ban chỉ huy khẩn nguy an ninh cảng hàng không.","Lực lượng kiểm soát an ninh hàng không."],"a":2},{"id":143,"q":"Theo Thông tư 14/2026/TT-BCA, ký kiệu khu vực hạn chế số 5 trên thẻ kiểm soát an ninh cảng hàng không, sân bay là gì?","o":["Khu vực sân đỗ tàu bay, đường hạ cất cánh, đường lăn và các khu vực khác trong sân bay","Khu vực hạn chế ga đến nội địa, quốc tế (Khu vực băng chuyền hành lý và các khu vực hạn chế khác tại ga đến quốc nội, quốc tế)","Khu vực nhà khách chuyên cơ trong những thời gian không có chuyến bay chuyên cơ;","Khu vực xử lý, phân loại hàng hóa, bưu gửi trong nhà ga hàng hóa"],"a":1},{"id":144,"q":"Theo Nghị định số 215/2026/NĐ-CP ngày 18/6/2026 của Chính phủ về an ninh hàng không, diễn tập cấp quốc gia đối phó với hành vi can thiệp bất hợp pháp đối với các tình huống cấp độ 2 được tổ chức tối thiểu bao nhiêu năm một lần?","o":["02 năm.","03 năm.","04 năm.","05 năm."],"a":2},{"id":145,"q":"Theo Nghị định số 215/2026/NĐ-CP của Chính phủ về an ninh hàng không, diễn tập đối phó với hành vi can thiệp bất hợp pháp đối với các tình huống cấp độ 2 cấp tỉnh được tổ chức tối thiểu bao nhiêu năm một lần?","o":["02 năm.","03 năm.","04 năm.","05 năm."],"a":1},{"id":146,"q":"Theo Nghị định số 215/2026/NĐ-CP của Chính phủ về an ninh hàng không, diễn tập cấp cơ sở được tổ chức đối với các tình huống cấp độ 1 hoặc một phần của tình huống cấp độ 2 tối thiểu bao nhiêu năm một lần?","o":["02 năm.","03 năm.","04 năm.","05 năm."],"a":0},{"id":147,"q":"Theo Nghị định 215/2026/NĐ-CP, lực lượng nào có trách nhiệm chủ trì, phối hợp với Công an cấp xã, phường lân cận và người khai thác cảng hàng không để duy trì, bảo đảm an ninh, trật tự xã hội tại khu vực công cộng thuộc cảng hàng không?","o":["Cục Quản lý xuất nhập cảnh.","Lực lượng kiểm soát an ninh hàng không tại cảng hàng không.","Cảng vụ hàng không.","Người khai thác cảng hàng không."],"a":1},{"id":148,"q":"Theo Luật quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ, vật liệu nào sau đây được quy định là vật liệu nổ quân dụng?","o":["Vật liệu nổ sử dụng cho mục đích quốc phòng, an ninh.","Vật liệu nổ sử dụng cho mục đích kinh tế, dân sự.","Hóa chất nguy hiểm, trực tiếp dùng để sản xuất thuốc nổ.","Đáp án A, B và C đúng."],"a":0},{"id":149,"q":"Theo Nghị định số 264/2026/NĐ-CP, Cơ quan nào dưới đây có thẩm quyền thông báo chuyến bay chuyên cơ, chuyên khoang của Việt Nam?","o":["Cảng vụ Hàng không.","Bộ xây dựng.","Văn phòng Trung ương Đảng.","Cục Hàng không Việt Nam."],"a":2},{"id":150,"q":"Theo Nghị định 162/2018/NĐ-CP, các hành vi dưới đây hành vi nào vi phạm quy định về quản lý và khai thác cảng hàng không, sân bay?","o":["Đặt biển quảng cáo tại cảng hàng không, sân bay không đúng quy định.","Nuôi, thả chim, gia súc, gia cầm, vật nuôi trong cảng hàng không, sân bay.","Bán hàng rong tại khu vực công cộng của cảng hàng không, sân bay.","Đáp án A, B và C đúng."],"a":1},{"id":151,"q":"Nghị định 162/2018/NĐ-CP, hành vi nào dưới đây sẽ bị xử phạt vi phạm hành chính trong lĩnh vực hàng không dân dụng?","o":["Không đeo thẻ kiểm soát an ninh hàng không theo quy định khi làm nhiệm vụ trong khu vực hạn chế của cảng hàng không, sân bay.","Sử dụng thẻ kiểm soát an ninh hàng không mà không đúng phạm vi ghi trên thẻ.","Không mang giấy tờ tùy thân khi hoạt động trong khu vực sân bay.","Đáp án A và B đúng."],"a":3},{"id":152,"q":"Theo Thông tư 14/2026/TT-BCA, ký kiệu khu vực hạn chế số 4 trên thẻ kiểm soát an ninh cảng hàng không, sân bay là gì?","o":["Khu vực sân đỗ tàu bay, đường hạ cất cánh, đường lăn và các khu vực khác trong sân bay","Khu vực hạn chế ga đi quốc tế bao gồm khu vực cách ly, các khu vực hạn chế khác của ga đi quốc tế;","Khu vực nhà khách chuyên cơ trong những thời gian không có chuyến bay chuyên cơ;","Khu vực xử lý, phân loại hàng hóa, bưu gửi trong nhà ga hàng hóa"],"a":2},{"id":153,"q":"Theo Nghị định 162/2018/NĐ-CP, hành vi nào sau đây vi phạm quy định về quản lý, sử dụng thẻ và giấy phép kiểm soát an ninh hàng không?","o":["Sử dụng Thẻ, Giấy phép kiểm soát an ninh hàng không hoặc Thẻ giám sát viên an ninh hàng không, an toàn hàng không của người khác vào khu vực hạn chế của cảng hàng không, sân bay, lên tàu bay.","Cho người khác mượn Thẻ kiểm soát an ninh hàng không, Giấy phép kiểm soát an ninh hàng không, Thẻ giám sát viên an ninh hàng không, an toàn hàng không để vào khu vực hạn chế tại cảng hàng không, sân bay, lên tàu bay.","Vào khu vực hạn chế, lên tàu bay mà không đúng cổng, cửa quy định, không qua kiểm tra, soi chiếu an ninh hàng không.","Đáp án A và B đúng."],"a":3},{"id":154,"q":"Theo Thông tư 14/2026/TT-BCA, tổ chức nào chịu trách nhiệm  kiểm soát người, đồ vật lên, xuống tàu bay?","o":["Cảng vụ hàng không","Người khai thác cảng","Lực lượng kiểm soát an ninh hàng không","Người khai thác tàu bay"],"a":3},{"id":155,"q":"Theo Thông tư 115/2026/TT-BCA, Cục Quản lý xuất nhập cảnh đình chỉ hiệu lực giấy phép thực hiện nhiệm vụ kiểm soát an ninh hàng không trong thời gian tối đa 06 tháng đối với trường hợp nào sau đây?","o":["Bị kỷ luật khiển trách; có sai phạm về chuyên môn nghiệp vụ nhưng chưa gây ra hậu quả mất an ninh.","Thực hiện nhiệm vụ không đúng với nghiệp vụ chuyên môn được cấp phép, năng định.","Bị kỷ luật khiển trách lần thứ 02 hoặc cảnh cáo.","Sai phạm về chuyên môn nghiệp vụ gây ra hậu quả mất an toàn, an ninh hàng không tại cảng hàng không, sân bay."],"a":1},{"id":156,"q":"Theo Thông tư 14/2026/TT-BCA, điện thoại trực ban, trực khẩn nguy, đường dây nóng, giải đáp thông tin cho hành khách phải có chức năng hiển thị, lưu số gọi đến, gọi đi, ghi âm với thời gian tối thiểu là bao lâu?","o":["02 giờ.","03 giờ.","04 giờ.","05 giờ."],"a":1},{"id":157,"q":"Theo Thông tư 14/2026/TT-BCA, tổ chức, cá nhân nào chủ trì, phối hợp với các cơ quan, đơn vị liên quan xác định các khu vực hạn chế và ranh giới cụ thể của từng khu vực hạn chế thuộc nhà ga, khu bay?","o":["Cục hàng không Việt Nam.","Đơn vị kiểm soát an ninh hàng không.","Hãng hàng không.","Đáp án A và C đúng."],"a":1},{"id":158,"q":"Theo Thông tư 14/2026/TT-BCA, đường giao thông, bãi đỗ xe dành cho hành khách đi tàu bay là khu vực nào?","o":["Khu vực công cộng.","Khu vực hạn chế.","Khu vực cách ly.","Đáp án A, B và C đúng."],"a":0},{"id":159,"q":"Theo Thông tư 14/2026/TT-BCA, trường hợp thực hiện nhiệm vụ khẩn nguy, cứu nạn, tổ chức, cá nhân nào có trách nhiệm phối hợp với lực lượng kiểm soát an ninh hàng không để kiểm soát hoạt động của người và phương tiện mà không cần thẻ, giấy phép kiểm soát an ninh hàng không, kiểm soát an ninh nội bộ?","o":["Cục Hàng không Việt Nam.","Cảng vụ hàng không.","Thủ trưởng cơ quan, đơn vị chủ quản của người và phương tiện tham gia thực hiện nhiệm vụ khẩn nguy, cứu nạn.","Đơn vị chủ quản khu vực hạn chế."],"a":2},{"id":160,"q":"Theo Thông tư 14/2026/TT-BCA, khu vực sản xuất, chế biến, cung ứng suất ăn là khu vực nào?","o":["Khu vực công cộng.","Khu vực hạn chế.","Khu vực cách ly.","Đáp án A, B và C đúng."],"a":1},{"id":161,"q":"Theo Thông tư 14/2026/TT-BCA, khu vực kho nhiên liệu cung cấp cho tàu bay là khu vực nào?","o":["Khu vực công cộng.","Khu vực hạn chế.","Khu vực cách ly.","Đáp án A, B và C đúng."],"a":1},{"id":162,"q":"Theo Thông tư 14/2026/TT-BCA, khu vực bảo dưỡng, sửa chữa, lắp đặt tàu bay là khu vực nào?","o":["Khu vực công cộng.","Khu vực hạn chế.","Khu vực cách ly.","Đáp án A, B và C đúng."],"a":1},{"id":163,"q":"Theo Thông tư 14/2026/TT-BCA, khi hành khách lên tàu bay việc tổ chức kiểm tra, đối chiếu giấy tờ về nhân thân, thẻ lên tàu bay của hành khách để đảm bảo đúng người, đúng chuyến bay thuộc trách nhiệm của đơn vị nào?","o":["Hãng hàng không.","Lực lượng kiểm soát an ninh hàng không.","Người chỉ huy tàu bay.","Sĩ quan an ninh trên không."],"a":0},{"id":164,"q":"Theo Thông tư 14/2026/TT-BCA, trong thời gian tàu bay đang bay, trách nhiệm bảo đảm an ninh hàng không, duy trì trật tự, kỷ luật trên tàu bay thuộc tổ chức, cá nhân nào?","o":["Hãng hàng không.","Người chỉ huy tàu bay.","Sĩ quan an ninh trên không.","Lực lượng kiểm soát an ninh hàng không."],"a":1},{"id":165,"q":"Theo Thông tư 14/2026/TT-BCA, chuyến bay thương mại thông thường được vận chuyển tối đa bao nhiêu người thuộc diện bị áp giải, gồm bị can, bị cáo, phạm nhân, người bị trục xuất, dẫn độ, người bị bắt theo quyết định truy nã?","o":["3 người.","4 người.","5 người.","7 người."],"a":2},{"id":166,"q":"Theo Thông tư 14/2026/TT-BCA, việc vận chuyển hành khách là bị can, bị cáo, phạm nhân, người bị trục xuất, dẫn độ, người bị bắt theo quyết định truy nã phải đảm bảo tuân thủ các yêu cầu nào sau đây?","o":["Chỗ ngồi của đối tượng bị áp giải được chỉ định ở các hàng ghế xa cửa lên, xuống, xa cửa thoát hiểm.","Đối tượng bị áp giải phải được người áp giải giám sát trong suốt chuyến bay. Không được khóa tay hoặc chân đối tượng bị áp giải vào bất cứ bộ phận nào của tàu bay.","Hãng hàng không phải bố trí cho người áp giải và người bị áp giải lên trước và rời khỏi tàu bay sau cùng so với các hành khách khác.","Đáp án A, B và C đúng."],"a":3},{"id":167,"q":"Theo Thông tư 14/2026/TT-BCA, cơ quan nào chịu trách nhiệm ban hành danh mục các vật phẩm nguy hiểm cấm hoặc hạn chế mang theo người và hành lý vào khu vực hạn chế, lên tàu bay?","o":["Cục Quản lý xuất nhập cảnh.","Cục hàng không Việt Nam.","Người khai thác cảng hàng không, sân bay.","Cảng vụ hàng không."],"a":0},{"id":168,"q":"Theo Thông tư 14/2026/TT-BCA, trạm cấp điện, cấp nước của cảng hàng không, sân bay (nằm ngoài khu vực hạn chế nhà ga, sân bay) là khu vực nào?","o":["Khu vực công cộng.","Khu vực hạn chế.","Khu vực cách ly.","Đáp án A, B và C đúng."],"a":1},{"id":169,"q":"Theo Thông tư 14/2026/TT-BCA, cán bộ, chiến sĩ, nhân viên kiểm soát an ninh hàng không thực hiện những nhiệm vụ nào sau đây?","o":["Trực tiếp thực hiện các biện pháp kiểm soát an ninh hàng không, phòng ngừa, đối phó với các hành vi can thiệp bất hợp pháp và xử lý vụ việc vi phạm an ninh hàng không.","Trực tiếp thực hiện các biện pháp kiểm soát an ninh hàng không, phòng ngừa, đối phó với các hành vi can thiệp bất hợp pháp và xử lý vụ việc vi phạm an toàn phòng chống cháy nổ tại cảng hàng không.","Trực tiếp thực hiện các biện pháp kiểm soát an ninh hàng không, phòng ngừa, đối phó với các hành vi can thiệp bất hợp pháp và xử lý hành vi buôn bán động vật hoang dã.","Trực tiếp thực hiện các biện pháp kiểm soát an ninh hàng không, phòng ngừa, đối phó với các hành vi rửa tiền và buôn bán hàng giả."],"a":0},{"id":170,"q":"Theo Thông tư 14/2026/TT-BCA, đơn vị nào chủ trì, phối hợp với đơn vị kiểm soát an ninh hàng không phân luồng, tuyến và lắp đặt các loại biển báo, biển chỉ dẫn tại các trục đường giao thông công cộng nội cảng?","o":["Cảng vụ hàng không","Người khai thác cảng hàng không","Cảnh sát giao thông địa phương","Công an địa phương nơi có cảng hàng không"],"a":1},{"id":171,"q":"Nghị định 215/2026/NĐ-CP, kiểm soát an ninh hàng không tăng cường cấp độ 3 được áp dụng trong trường hợp nào sau đây?","o":["Có thông tin xác thực về một âm mưu can thiệp bất hợp pháp vào hoạt động hàng không dân dụng có địa điểm, mục tiêu, thời gian cụ thể.","Có tình hình mất an ninh chính trị, trật tự xã hội đặc biệt nghiêm trọng tại địa phương.","Có thông tin tình báo về một âm mưu can thiệp bất hợp pháp vào hoạt động hàng không dân dụng nhưng chưa xác định địa điểm, mục tiêu, thời gian cụ thể.","Đáp án A và B đúng."],"a":3},{"id":172,"q":"Theo Nghị định 215/2026/NĐ-CP, cơ quan, đơn vị nào thực hiện chức năng Nhà chức trách an ninh hàng không Việt Nam?","o":["Cục Hàng không Việt Nam.","Cục Quản lý xuất nhập cảnh thuộc Bộ Công an.","Cảng vụ hàng không.","Bộ Xây dựng."],"a":1},{"id":173,"q":"Theo Thông tư 14/2026/TT-BCA, cơ quan nào có trách nhiệm chấp thuận miễn kiểm tra an ninh hàng không đối với hành khách, hành lý, hàng hóa và chịu trách nhiệm trong những trường hợp có yêu cầu của cơ quan có thẩm quyền theo quy định của pháp luật?","o":["Bộ Công an.","Cục Quản lý xuất nhập cảnh.","Cục Hàng không Việt Nam.","Đơn vị kiểm soát an ninh hàng không."],"a":1},{"id":174,"q":"Theo Thông tư 14/2026/TT-BCA, tổ chức, cá nhân nào chịu trách nhiệm thực hiện các biện pháp kiểm soát an ninh hàng không, xử lý ban đầu các vụ việc vi phạm về an ninh hàng không và đối phó với hành vi can thiệp bất hợp pháp vào hoạt động hàng không dân dụng tại cảng hàng không, sân bay?","o":["Lực lượng kiểm soát an ninh hàng không.","Người khai thác cảng hàng không, sân bay.","Cảng vụ hàng không.","Công an địa phương."],"a":0},{"id":175,"q":"Theo Thông tư 14/2026/TT-BCA, cơ quan, đơn vị nào chủ trì, phối hợp với các đơn vị liên quan quyết định số lượng, vị trí, thời gian hoạt động của các điểm kiểm soát an ninh hàng không?","o":["Cục Quản lý xuất nhập cảnh.","Cảng vụ hàng không.","Đơn vị kiểm soát an ninh hàng không.","Người khai thác cảng hàng không, sân bay."],"a":2},{"id":176,"q":"Thông tư 14/2026/TT-BCA, định kỳ 06 tháng một lần hoặc đột xuất, đơn vị nào có trách nhiệm chủ trì, phối hợp với các cơ quan, đơn vị liên quan đánh giá và xác định mức độ rủi ro an ninh hàng không tại cảng hàng không, sân bay?","o":["Công an địa phương.","Cảng vụ hàng không.","Đơn vị kiểm soát an ninh hàng không.","Người khai thác cảng hàng không, sân bay."],"a":2},{"id":177,"q":"Theo Nghị định 215/2026/NĐ-CP, cơ quan, đơn vị nào chủ trì xác định khu vực công cộng thuộc cảng hàng không trên cơ sở đánh giá rủi ro an ninh hàng không?","o":["Cục hàng không Việt Nam.","Đơn vị kiểm soát an ninh hàng không.","Tổng công ty Cảng hàng không Việt Nam.","Đáp án A và C đúng."],"a":1},{"id":178,"q":"Theo Nghị định 215/2026/NĐ-CP, cơ quan, đơn vị nào chủ trì phân luồng giao thông tại các khu vực công cộng thuộc cảng hàng không?","o":["Cục hàng không Việt Nam.","Đơn vị kiểm soát an ninh hàng không.","Tổng công ty Cảng hàng không Việt Nam.","Đáp án A và C đúng."],"a":1},{"id":179,"q":"Theo Thông tư 14/2026/TT-BCA, đơn vị nào chịu trách nhiệm kiểm tra để bảo đảm đồ vật cá nhân, hành lý xách tay của hành khách nối chuyến, quá cảnh, tạm dừng nội địa xuống khỏi tàu bay, không để lại trên tàu bay?","o":["Người khai thác tàu bay.","Đơn vị cung cấp dịch vụ vệ sinh tàu bay.","Đơn vị kiểm soát an ninh hàng không.","Người khai thác cảng hàng không, sân bay."],"a":0},{"id":180,"q":"Theo Thông tư 14/2026/TT-BCA, khi làm thủ tục cho hành khách, trường hợp nhân viên làm thủ tục vận chuyển thấy có dấu hiệu nghi vấn phải thông báo cho tổ chức, cá nhân nào để tăng cường kiểm tra?","o":["Cán bộ kiểm soát an ninh hàng không.","Nhân viên giám sát chất lượng dịch vụ.","Cán bộ Cảng vụ hàng không.","Đáp án A, B và C đúng."],"a":0},{"id":181,"q":"Điều kiện nào để cán bộ, chiến sĩ được cấp thẻ giám sát viên an ninh hàng không?","o":["Có thời gian làm việc trong lĩnh vực an ninh hàng không hoặc bảo đảm an ninh quốc gia tối thiểu 01 năm.","Có thời gian làm việc trong lĩnh vực an ninh hàng không hoặc bảo đảm an ninh quốc gia tối thiểu 02 năm.","Có thời gian thực tập nghiệp vụ chuyên môn phù hợp tối thiểu là 06 tháng.","Đạt tối thiểu 90 điểm trong kỳ sát hạch chuyên môn."],"a":1},{"id":182,"q":"Cơ quan nào chủ trì thực hiện việc đầu tư, xây dựng, trang bị hạ tầng kỹ thuật phục vụ chỉ huy, điều hành và triển khai đối phó với hành vi can thiệp bất hợp pháp?","o":["Bộ Công an.","Bộ Khoa học và Công nghệ.","Bộ Quốc phòng.","Bộ Xây dựng."],"a":0},{"id":183,"q":"Theo Thông tư 14/2026/TT-BCA, hành lý ký gửi của hành khách xuất phát, nối chuyến, quá cảnh sau khi làm thủ tục chấp nhận vận chuyển và kiểm tra an ninh hàng không được giám sát như thế nào?","o":["Giám sát liên tục bằng camera giám sát an ninh.","Giám sát liên tục bằng camera giám sát an ninh hoặc do nhân viên kiểm soát an ninh hàng không trực tiếp giám sát hoặc cả hai biện pháp cho đến khi đưa lên tàu bay.","Giám sát liên tục bằng camera giám sát an ninh hoặc do cán bộ, chiến sĩ kiểm soát an ninh hàng không trực tiếp giám sát hoặc cả hai biện pháp cho đến khi đưa lên tàu bay; bảo vệ bằng biện pháp thích hợp cho đến khi tàu bay cất cánh; không được để những người không có trách nhiệm tiếp cận hành lý ký gửi.","Đáp án A, B và C đúng."],"a":2},{"id":184,"q":"Theo Thông tư 14/2026/TT-BCA, việc kiểm soát và giám sát khu vực băng chuyền hành lý ký gửi, khu vực phân loại hành lý ký gửi được thực hiện như thế nào?","o":["Kiểm soát và giám sát liên tục bằng camera giám sát an ninh.","Do nhân viên kiểm soát an ninh hàng không trực tiếp giám sát.","Kiểm soát và giám sát liên tục bằng camera giám sát an ninh hoặc do nhân viên kiểm soát an ninh hàng không trực tiếp giám sát.","Được kiểm soát và giám sát liên tục bằng camera giám sát an ninh hoặc do cán bộ, chiến sĩ kiểm soát an ninh hàng không trực tiếp giám sát hoặc cả hai biện pháp, người không có trách nhiệm không được phép tiếp cận những khu vực này."],"a":3},{"id":185,"q":"Theo Thông tư 14/2026/TT-BCA, trong trường hợp hành khách đã được cấp thẻ lên tàu bay nhưng không có mặt để thực hiện chuyến bay, đơn vị nào chịu trách nhiệm đảm bảo tất cả hành lý của hành khách đó phải được đưa xuống tàu bay trước khi cho tàu bay khởi hành?","o":["Hãng hàng không.","Đơn vị kiểm soát an ninh hàng không.","Người khai thác cảng hàng không, sân bay.","Đáp án A, B và C đúng."],"a":0},{"id":186,"q":"Theo Thông tư 14/2026/TT-BCA, cơ quan, đơn vị nào chịu trách nhiệm bố trí khu vực để lưu giữ hành lý thất lạc, hành lý không có người nhận, đồ vật, hành lý không xác nhận được chủ cho đến khi đồ vật, hành lý này được chuyển đi?","o":["Hãng hàng không.","Người khai thác cảng hàng không, sân bay.","Doanh nghiệp cung cấp dịch vụ khai thác nhà ga hành khách.","Đơn vị kiểm soát an ninh hàng không."],"a":2},{"id":187,"q":"Theo Thông tư 14/2026/TT-BCA, Cục Quản lý xuất nhập cảnh thống nhất với cơ quan, đơn vị nào trong việc kiểm tra, giám sát an ninh hàng không đối với thành viên tổ bay, hành khách, hành lý, hàng hóa của chuyến bay chuyên cơ, chuyên khoang?","o":["Bộ Quốc Phòng.","Bộ Tư lệnh Cảnh vệ - Bộ Công an.","Bộ Xây dựng.","Đáp án A, B và C đúng."],"a":1},{"id":188,"q":"Theo Nghị định 215/2026/NĐ-CP, người có hành vi phát ngôn mang tính đe dọa sử dụng bom, mìn, chất nổ, vật liệu nổ, chất phóng xạ, vũ khí sinh học, hóa học trong khu vực làm thủ tục vận chuyển, khu vực cách ly, sân bay, trên tàu bay bị xử lý như thế nào?","o":["Phạt cảnh cáo.","Cấm vận chuyển từ 3 đến 12 tháng.","Cấm vận chuyển từ 12 đến 24 tháng.","Cấm vận chuyển vĩnh viễn."],"a":1},{"id":189,"q":"Theo Thông tư 14/2026/TT-BCA, trường hợp tủ, túi đựng suất ăn khi di chuyển từ khu vực khác vào khu vực hạn chế mà không có niêm phong an ninh, hoặc niêm phong an ninh bị rách vỡ, hoặc tủ, túi đựng suất ăn không còn nguyên vẹn thì cán bộ kiểm soát ANHK tiến hành kiểm tra như thế nào?","o":["Từ chối không cho di chuyển vào khu vực hạn chế.","Lập biên bản ghi nhận sự việc và chấp nhận hoàn thành thủ tục an ninh.","Phỏng vấn, làm rõ nguyên nhân trước khi chấp nhận hoàn thành thủ tục an ninh.","Kiểm tra an ninh hàng không bằng soi chiếu hoặc kiểm tra trực quan trước khi đưa vào khu vực hạn chế tại cảng hàng không để đưa lên tàu bay và phải được giám sát an ninh hàng không liên tục."],"a":3},{"id":190,"q":"Khi nhận được thông báo, tổ chức, cá nhân nào tại cảng hàng không, sân bay lên ngay tàu bay để phối hợp với tổ bay, áp dụng các biện pháp cưỡng chế cần thiết để áp giải hành khách gây rối xuống khỏi tàu bay?","o":["Cảng vụ hàng không.","Người khai thác cảng.","Đại diện hãng.","Lực lượng kiểm soát an ninh hàng không."],"a":3},{"id":191,"q":"Theo Thông tư 14/2026/TT-BCA, cấp thẻ kiểm soát an ninh Công an cửa khẩu CHKQT Tân Sơn Nhất có ký hiệu đơn vị là gì?","o":["STS.","SDN.","TSN.","SND."],"a":0},{"id":192,"q":"Theo Thông tư 14/2026/TT-BCA, tổ chức, cá nhân nào chịu trách nhiệm phối hợp với lực lượng kiểm soát an ninh hàng không để quản lý, giám sát chặt chẽ người bị áp giải lên, xuống tàu bay?","o":["Nhân viên đại diện hãng hàng không.","Nhân viên Cảng vụ hàng không khu vực.","Nhân viên phục vụ hành khách.","Người áp giải."],"a":3},{"id":193,"q":"Theo Thông tư 14/2026/TT-BCA, tổ chức, cá nhân nào chịu trách nhiệm quản lý, giám sát hành khách bị từ chối nhập cảnh, quá cảnh tại cảng hàng không?","o":["Công an địa phương.","Hãng hàng không.","Lực lượng kiểm soát an ninh hàng không.","Cảng vụ hàng không khu vực."],"a":2},{"id":194,"q":"Theo Nghị định 215/2026/NĐ-CP, người có hành vi chiếm đoạt, gây bạo loạn tại cảng hàng không và cơ sở cung cấp dịch vụ điều hành bay bị xử lý như thế nào?","o":["Cấm vận chuyển từ 3 đến 12 tháng.","Cấm vận chuyển từ 12 đến 24 tháng.","Phạt tiền đến 100.000.000 đồng.","Cấm vận chuyển vĩnh viễn."],"a":3},{"id":195,"q":"Trong trường hợp hành khách gây rối chưa lên tàu bay, lực lượng nào có trách nhiệm ngăn chặn, không cho phép hành khách lên tàu bay, tạm giữ người, giấy tờ về nhân thân của hành khách?","o":["Hãng hàng không.","Cảng vụ hàng không.","Lực lượng kiểm soát an ninh hàng không.","Đáp án A, B và C đúng."],"a":2},{"id":196,"q":"Theo Thông tư 14/2026/TT-BCA, quy trình, thủ tục và thẩm quyền quyết định từ chối vận chuyển hành khách vì lý do an ninh hàng không phải được quy định như thế nào?","o":["Quy định cụ thể, rõ ràng trong chương trình an ninh hàng không của hãng hàng không.","Quy định cụ thể, rõ ràng trong chương trình an ninh hàng không của Đơn vị bảo đảm hoạt động bay.","Quy định cụ thể, rõ ràng trong chương trình hành động vì chất lượng dịch vụ của hãng hàng không.","Quy định cụ thể, rõ ràng trong chương trình an ninh hàng không của Cảng hàng không."],"a":0},{"id":197,"q":"Theo Thông tư 14/2026/TT-BCA, những trường hợp nào sau đây phải tái kiểm tra an ninh hàng không?","o":["Hành khách, hành lý xách tay đã kiểm tra an ninh hàng không nhưng ra khỏi khu vực hạn chế khi trở lại phải tái kiểm tra an ninh hàng không.","Khu vực, người, phương tiện, đồ vật trong khu vực hạn chế có sự tiếp xúc, trộn lẫn với người, đồ vật chưa qua kiểm tra an ninh hàng không.","Khu vực, người, phương tiện, đồ vật trong khu vực hạn chế có sự tiếp xúc, trộn lẫn với người nghi ngờ mang theo vật phẩm nguy hiểm hoặc phương tiện, đồ vật nghi ngờ chứa vật phẩm nguy hiểm.","Đáp án A, B và C đúng."],"a":3},{"id":198,"q":"Theo Thông tư 14/2026/TT-BCA, khi phát hiện vật phẩm nguy hiểm không có giấy phép theo quy định của pháp luật, lực lượng kiểm soát an ninh hàng không tại cảng hàng không, sân bay phải xử lý như thế nào?","o":["Lập biên bản theo mẫu quy định tại  Phụ lục XVIII của Thông tư 14/2026/TT-BCA.","Chuyển giao người, hồ sơ, vật phẩm nguy hiểm cho cơ quan chức năng có thẩm quyền.","Thông báo cho hãng hàng không để có biện pháp giải quyết thích hợp.","Đáp án A, B và C đúng."],"a":3},{"id":199,"q":"Theo Thông tư 14/2026/TT-BCA, việc lên tàu bay của lực lượng kiểm soát an ninh hàng không để trấn áp, cưỡng chế, áp giải đối tượng vi phạm được thực hiện theo yêu cầu của tổ chức, cá nhân nào?","o":["Người khai thác cảng hàng không, sân bay hoặc đại diện hãng hàng không.","Cảng vụ hàng không hoặc người khai thác cảng hàng không, sân bay.","Người chỉ huy tàu bay hoặc người khai thác Cảng.","Người chỉ huy tàu bay hoặc người đứng đầu đơn vị kiểm soát an ninh hàng không."],"a":3},{"id":200,"q":"Theo Thông tư 14/2026/TT-BCA, tổ chức, cá nhân nào chịu trách nhiệm bố trí nơi xử lý, giải quyết vụ việc vi phạm an ninh hàng không?","o":["Người khai thác Cảng hàng không.","Cảng vụ hàng không.","Lực lượng kiểm soát an ninh hàng không.","Công an địa phương."],"a":2},{"id":201,"q":"Theo Thông tư 14/2026/TT-BCA, quy trình xử lý các vụ việc vi phạm an ninh hàng không, trật tự công cộng tại cảng hàng không, sân bay được quy định như thế nào?","o":["Ngăn chặn hành vi vi phạm; tạm giữ đối tượng vi phạm; Kiểm tra, lục soát, thu giữ tang vật, chứng cứ.","Đưa người, tang vật vi phạm về nơi quy định để giải quyết, xử lý vi phạm; Báo cáo ngay cho chỉ huy đơn vị trực ca công tác, lập biên bản vi phạm theo mẫu quy định.","Bảo vệ hiện trường và trao đổi các cơ quan, đơn vị liên quan tại cảng hàng không, sân bay nếu xét thấy cần thiết.","Đáp án A, B và C đúng."],"a":3},{"id":202,"q":"Lực lượng kiểm soát an ninh hàng không phải làm gì khi bàn giao vụ việc cho cơ quan nhà nước có thẩm quyền khác?","o":["Lập biên bản bàn giao theo mẫu quy định và phối hợp thực hiện các biện pháp dẫn giải, giữ người, phương tiện, tang vật vi phạm khi được yêu cầu.","Phối hợp chặt chẽ với cơ quan chức năng trong quá trình xử lý vụ việc.","Tiếp tục phối hợp đấu tranh, làm rõ những vấn đề phát sinh.","Đáp án A và C đúng."],"a":0},{"id":203,"q":"Thông tư 14/2026/TT-BCA, đồ vật, hành lý không xác nhận được chủ được hiểu như thế nào?","o":["Là đồ vật bị bỏ tại cảng hàng không, sân bay mà không có căn cứ xác định được chủ của đồ vật, hành lý đó.","Là hành lý đến một Cảng hàng không, sân bay mà không được hành khách, tổ bay lấy hoặc nhận.","Là hành lý của hành khách, tổ bay bị tách rời khỏi hành khách, tổ bay trong quá trình vận chuyển.","Là đồ vật của hành khách, tổ bay đến một Cảng hàng không, sân bay mà không được hành khách, tổ bay lấy hoặc nhận."],"a":0},{"id":204,"q":"Theo Thông tư 14/2026/TT-BCA, mẫu biên bản vi phạm an ninh hàng không được quy định tại phụ lục nào?","o":["Phụ lục XVIII.","Phụ lục XIX.","Phụ lục XX.","Phụ lục XXI."],"a":0},{"id":205,"q":"Khi xuất hiện các tình huống phải hạ cánh khẩn cấp người chỉ huy tàu bay phải báo cáo kịp thời với cơ quan, đơn vị nào?","o":["Cục hàng không Việt Nam.","Cơ sở cung cấp dịch vụ không lưu.","Cảng hàng không nơi tàu bay hạ cánh.","Hãng hàng không."],"a":1},{"id":206,"q":"Một tàu bay bị coi là lâm nguy trong trường hợp nào sau đây?","o":["Tàu bay bị hỏng nghiêm trọng khi lăn, cất cánh, đang bay hoặc hạ cánh.","Tàu bay bị phá hủy hoàn toàn và buộc phải hạ cánh ngoài sân bay.","Tàu bay hoặc người trong tàu bay bị nguy hiểm mà các thành viên tổ bay không thể khắc phục được hoặc tàu bay bị mất liên lạc và chưa xác định được vị trí.","Tàu bay đã qua thời hạn tìm kiếm và có quyết định chấm dứt hoạt động tìm kiếm cứu nạn."],"a":2},{"id":207,"q":"Hằng năm, đơn vị nào chủ trì, phối hợp với các cơ quan, tổ chức xây dựng và triển khai kế hoạch phổ biến, giáo dục pháp luật về an ninh hàng không?","o":["Bộ Công an.","Cục Quản lý xuất nhập cảnh.","Bộ Xây dựng.","Cục hàng không Việt Nam."],"a":1},{"id":208,"q":"Cơ quan, đơn vị nào có trách nhiệm phổ biến, giáo dục pháp luật về an ninh hàng không cho nhân dân khu vực lân cận cảng hàng không để nâng cao ý thức chấp hành, tuân thủ các quy định về an ninh hàng không?","o":["Cục Quản lý xuất nhập cảnh.","Người khai thác Cảng.","Chính quyền địa phương nơi có cảng hàng không .","Hãng hàng không."],"a":2},{"id":209,"q":"Cơ quan, đơn vị nào có trách nhiệm thường xuyên tổ chức phổ biến các quy định về an ninh hàng không cho hành khách đi tàu bay?","o":["Cục Quản lý xuất nhập cảnh.","Người khai thác Cảng.","Chính quyền địa phương nơi có cảng hàng không.","Hãng hàng không."],"a":3},{"id":210,"q":"Theo Nghị định 215/2026/NĐ-CP, Ban Chỉ huy khẩn nguy an ninh là gì?","o":["Tổ chức được thiết lập để đánh giá nguy cơ xảy ra hành vi can thiệp bất hợp pháp đối với hoạt động hàng không dân dụng, có nhiệm vụ chỉ huy, điều hành và điều phối các lực lượng liên quan khi đối phó với hành vi can thiệp bất hợp pháp.","Tổ chức gồm đại diện các cơ quan quản lý nhà nước, lực lượng vũ trang, doanh nghiệp hoạt động thường xuyên tại cảng hàng không.","Tổ chức được thiết lập để đánh giá nguy cơ xảy ra hành vi gây mất an toàn đối với hoạt động hàng không dân dụng.","Đáp án A, B và C đúng."],"a":0},{"id":211,"q":"Khi xảy ra hành vi can thiệp bất hợp pháp cấp độ 1 tại cơ sở bảo đảm hoạt động bay ngoài cảng hàng không, đơn vị nào chịu trách nhiệm đối phó ban đầu và báo cáo ngay cho Ban Chỉ huy khẩn nguy an ninh cấp tỉnh?","o":["Ban Chỉ huy khẩn nguy an ninh cấp cảng hàng không.","Hãng hàng không Việt Nam.","Tổng công ty Quản lý bay Việt Nam.","Đơn vị kiểm soát an ninh hàng không tại cảng hàng không."],"a":2},{"id":212,"q":"Đối với hành vi can thiệp bất hợp pháp cấp độ 1 tại địa bàn cảng hàng không tổ chức nào chịu trách nhiệm chỉ huy đối phó ?","o":["Ban Chỉ huy khẩn nguy an ninh cấp quốc gia.","Ban Chỉ huy khẩn nguy an ninh cấp tỉnh.","Ban Chỉ huy khẩn nguy an ninh cấp cảng hàng không.","Đáp án A, B và C đúng."],"a":2},{"id":213,"q":"Đối với hành vi can thiệp bất hợp pháp xảy ra tại cơ sở bảo đảm hoạt động bay ngoài cảng hàng không, Tổng công ty Quản lý bay Việt Nam chịu trách nhiệm đối phó và báo cáo ngay tổ chức nào để chỉ đạo đối phó ?","o":["Ban Chỉ huy khẩn nguy an ninh cấp quốc gia.","Ban Chỉ huy khẩn nguy an ninh cấp tỉnh.","Ban Chỉ huy khẩn nguy an ninh cấp cảng hàng không.","Đáp án A, B và C đúng."],"a":1},{"id":214,"q":"Doanh nghiệp cung cấp dịch vụ nhiên liệu cho tàu bay và suất ăn hàng không có trách nhiệm tổ chức lực lượng kiểm soát an ninh hàng không để thực hiện nhiệm vụ tại đâu?","o":["Trên tàu bay và hoạt động khai thác bên ngoài cảng hàng không.","Tại cảng hàng không và cơ sở xử lý hàng hóa, bưu gửi.","Tại cơ sở cung cấp dịch vụ không lưu nằm ngoài khu vực hạn chế.","Tại cơ sở cung cấp nhiên liệu cho tàu bay và chế biến suất ăn hàng không."],"a":3},{"id":215,"q":"Công tác bảo đảm an ninh đối với suất ăn phục vụ chuyến bay chuyên cơ, chuyên khoang xuất phát từ Việt Nam, các mẫu suất ăn phải được niêm phong và lưu giữ ít nhất bao lâu kể từ khi đưa lên phục vụ?","o":["12 giờ.","24 giờ.","48 giờ.","72 giờ."],"a":1},{"id":216,"q":"Tổ chức, cá nhân nào tại cảng hàng không có trách nhiệm phối hợp với hãng hàng không thực hiện chuyến bay chuyên cơ, chuyên khoang kiểm tra trực quan đối với suất ăn xuất phát từ Việt Nam trước khi đưa vào dụng cụ chứa đựng suất ăn?","o":["Bộ Tư lệnh Cảnh vệ.","Doanh nghiệp cung cấp dịch vụ suất ăn cho tàu bay.","Lực lượng kiểm soát an ninh hàng không.","Cục hàng không Việt Nam."],"a":2},{"id":217,"q":"Tổ chức, cá nhân nào tại cảng hàng không chủ trì, phối hợp với các đơn vị liên quan thiết lập các chốt kiểm soát tại các đường ra, vào và khu vực công cộng của cảng hàng không khi có chuyến bay chuyên cơ, chuyên khoang?","o":["Bộ Tư lệnh Cảnh vệ.","Công an địa phương nơi có cảng hàng không.","Lực lượng kiểm soát an ninh hàng không.","Cục hàng không Việt Nam."],"a":2},{"id":218,"q":"Giám sát an ninh hàng không được thực hiện bằng các hình thức nào?","o":["Sử dụng hệ thống camera giám sát; hệ thống cảm biến phát hiện, cảnh báo xâm nhập hoặc sử dụng các thiết bị kỹ thuật khác.","Sử dụng con ngườ
